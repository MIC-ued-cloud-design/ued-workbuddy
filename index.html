      '<div id="fqhost">'+f()+'</div></div>';
  };

  /* 输入分档 —— 只决定「这次要不要检索」，具体怎么答交给 system prompt 的规则。

       「哈啰」→ 0 段命中，模型却把它当词条解释「哈啰通常是一个打招呼的用语」还贴免责声明；
       「你能干什么」→ 检索到 11 段无关的订单文档，模型拿它们编自己的能力。
     🔴 漏判的后果是退回原来的行为（照旧检索），不会更坏 —— 所以这里宁可判得保守。
     🔴 不按长度判：「字号」「星级」「退款」都是 2 字的真业务问题。 */
  var META_RE = new RegExp(
    '^(你|您)?(是谁|叫什么|能干(什么|啥)|能做(什么|啥|些什么)|会(干|做)什么|有(什么|啥)用'
    + '|怎么用|怎么使用|如何使用|能帮我做什么|能帮我什么|用来(干|做)什么)'
    + '|^(这个?(页面|工具|网站|东西))(是(什么|干什么的|干嘛的))'
    + '|^(帮助|help|使用说明|说明书)$', 'i');
  var HELLO_RE = new RegExp(
    '^(你好|您好|哈啰|哈喽|哈罗|嗨|hi|hello|hey|yo|在吗|在不在|在么|早|早上好|中午好'
    + '|下午好|晚上好|晚安|谢谢|谢啦|感谢|多谢|3q|辛苦了|好的|好嘞|收到|明白|懂了|ok|okay'
    + '|再见|拜拜|bye|测试|test|试一下|随便问问)[\\s!!。.~、,，?？]*$', 'i');

  function chatKind(q){
    var t = String(q||'').trim();
    if(META_RE.test(t))  return 'meta';    // 元问题：答案这个页面自己最清楚，别去检索
    if(HELLO_RE.test(t)) return 'hello';   // 寒暄：不检索、不解释词义、不贴免责声明
    return 'ask';
  }
  window.wbChatKind = chatKind;

  /* 当前时间。模型自己没有时钟 —— 不告诉它今天几号，「今天 / 现在 / 本周 / 最近」这类问法
     它一律答不出，而且会答成「资料里没有」，把责任推给知识库。
     取浏览器时钟、每次提问现算：写进 SYS 会被生成那一刻的日期钉死，页面开过夜就错。 */
  function nowLine(){
    var d=new Date(), w='日一二三四五六'.charAt(d.getDay());
    function p2(n){ return (n<10?'0':'')+n; }
    return '当前时间：'+d.getFullYear()+' 年 '+(d.getMonth()+1)+' 月 '+d.getDate()+' 日，星期'+w
      + ' '+p2(d.getHours())+':'+p2(d.getMinutes())+'（读的是用户电脑的时钟）。\n'
      + '问到「今天 / 现在 / 本周 / 最近 / 还有多少天」就按这个时间算，'
      + '这一条不需要参考资料，也不要说「资料里没有」。';
  }

  /* ── 「我是谁」这段跟底座绑定，必须跟着 mode() 走 ──
     2026-09-09 修：SYS 里原来写死「你用的是一个免费的小模型」，那句是给共享通道的 GLM-4-Flash 写的。
     桥改用 Opus 5（06601e9）时只改了发出去的 model 名和下拉显示，这句没跟着改 ——
     而 Claude 从自己的运行环境知道自己是谁，两条信息打架，它就照实把矛盾报给用户了（实际发生过）。
     🔴 判据：prompt 里描述「我是谁 / 我有多强 / 我是不是免费的」的句子跟底座绑定，
     底座一分叉它就得跟着分叉；只有跟模型强弱无关的纪律（数字照抄资料、拿不准就引原句）
     才能留在 SYS 那份公共文本里。
     跟 nowLine() 一样每次提问现拼：底座是运行时才定的（桥可能中途起来或掉线）。 */
  function baseLine(){
    var m = mode();
    if(m==='bridge')
      return '你现在跑在这位同事自己电脑上的 Claude Code 里，模型是 Claude Opus 5。'
        + '有人问起你是什么模型，就照这个说，不要自称小模型、免费模型或别家的模型。';
    if(m==='own')
      return '你现在跑在这位同事自己填的模型接口上，页面这边不知道具体是哪一家的哪个模型。'
        + '有人问起就如实说不确定，不要猜一个型号，也不要自称是某个具体模型。';
    return '你现在跑在部门共享的免费通道上，模型是智谱 GLM-4-Flash，判断力跟 Claude 不在一个档。'
      + '有人问起你是什么模型，就照这个说。';
  }
  /* 暴露出来是为了能验 —— 闭包里的函数探针够不着，
     上一次就是 loadKB 藏在闭包里，探针三条全报「没查到」像库里真没有（其实是没打开库）。 */
  window.wbBaseLine = baseLine;

  /* ── 读网页（本机桥 1.1.0 起）──
     问题里带网址就把网址发给桥，桥用独立 Chrome 取正文附在资料后面；白名单在桥那头，页面不判。
     只有桥探到 Chrome 才发；1.0.x 的老桥不认 urls 字段、原样忽略，所以老桥也不会坏。 */
  function webUrlsIn(q){
    var m = String(q||'').match(/https?:\/\/[^\s<>"'，。；、）)】」』\]]+/g) || [];
    var seen={}, out=[];
    m.forEach(function(u){ u=u.replace(/[.,;:!?]+$/,''); if(!seen[u]){ seen[u]=1; out.push(u); } });
    return out.slice(0,3);
  }
  function webReady(){ return mode()==='bridge' && !!(BRIDGE.info && BRIDGE.info.web && BRIDGE.info.web.ok); }
  function escW(x){ return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function ctxOf(chunks, kind){
    if(kind==='hello')
      return '（这次没有检索资料。用户这句话是打招呼或客套，不是提问。'
        + '自然地回一句话就好，别解释这个词是什么意思，别贴「这是通用知识」那句声明，'
        + '别列自己的能力清单。回完可以顺一句问他这次想做什么。）';
    if(kind==='meta')
      return '（这次没有检索资料 —— 用户问的是「你是谁 / 你能干什么」这类关于我自己的问题，'
        + '答案在你的角色说明里，不在业务资料里。按角色说明里「你能做什么」和「你做不到什么」'
        + '两段如实说，分成能做和做不到两小段，别引用业务文档，别贴「这是通用知识」那句声明。'
        + '🔴 不要凭想象夸大能力。）';
    /* 零命中的兜底话术必须跟规则 1 的分层一致 ——
       原来这里写「不要凭常识回答」，会把「今天几号」这类通用问题也一起挡掉。 */
    if(!chunks.length) return '（这次没检索到相关资料。先看这句话到底是哪一类：'
      + '如果是 MIC 业务或飞鹊规范的问题，就如实说资料库里没有这一条，不要凭印象编；'
      + '如果是跟 MIC 无关的通用问题，就直接回答；'
      + '如果它其实只是一句寒暄或闲聊，就自然回一句，别把它当词条来解释。）';
    return chunks.map(function(c,i){
      return '【资料 '+(i+1)+'｜'+c.d+(c.t? ' › '+c.t : '')+'】\n'+c.x;
    }).join('\n\n');
  }

  /* ── 调模型（流式） ── */
  function callModel(q, chunks, onDelta, signal, kind){
    var c=cfg(), m=mode();
    var url = (m==='bridge') ? BRIDGE.url+'/v1/chat/completions' : (m==='own') ? endpoint() : PROXY.url;
    var mdl = (m==='bridge') ? 'opus' :   /* 2026-09-09 吉吉定：本机 Claude 用 Opus 5。别名交给 claude 自己解析成当前最新 Opus；桥只放行 sonnet/haiku/opus 三个别名 */ (m==='own') ? modelName() : 'glm-4-flash';
    var head = {'Content-Type':'application/json'};
    if(m==='own') head['Authorization'] = 'Bearer '+c.key;
    else if(m==='proxy' && PROXY.pass) head['X-WB-Pass'] = PROXY.pass;
    /* 多轮：历史只带问答文本，不重复带资料——资料每轮重新检索，
       否则几轮下来上下文会被十几段资料撑爆，而且旧资料会干扰新问题。
       只留最近 4 轮，每条截到 1200 字。 */
    var msgs=[{role:'system', content:nowLine()+'\n\n'+SYS+'\n\n'+baseLine()}];
    (R.turns||[]).slice(-4).forEach(function(t){
      if(!t.q || !t.ans) return;
      msgs.push({role:'user',      content:String(t.q).slice(0,1200)});
      msgs.push({role:'assistant', content:String(t.ans).slice(0,1200)});
    });
    msgs.push({role:'user', content:'参考资料：\n\n'+ctxOf(chunks, kind)+'\n\n──────────\n\n我的问题：'+q});
    var body={ model:mdl, stream:true, temperature:0.1, messages:msgs };   // 低温：这类问答要准不要花
    var urls = webUrlsIn(q);
    if(urls.length && webReady()) body.urls = urls;   /* 桥会用独立 Chrome 读这些网址的正文，附在资料后面 */
    return fetch(url,{ method:'POST', signal:signal, headers:head, body:JSON.stringify(body) })
      .catch(function(e){
        if(m==='bridge' && e && e.name!=='AbortError'){ BRIDGE.ok=false; onBridgeChange(); }
        throw e;
      })
      .then(function(res){
        if(!res.ok){
          return res.text().then(function(t){
            var e=new Error(t||''); e.status=res.status; throw e; });
        }
        var reader=res.body.getReader(), dec=new TextDecoder(), buf='', full='';
        function pump(){
          return reader.read().then(function(r){
            if(r.done){ return full; }
            buf += dec.decode(r.value,{stream:true});
            var lines=buf.split('\n'); buf=lines.pop();
            lines.forEach(function(ln){
              ln=ln.trim();
              if(!ln || ln.indexOf('data:')!==0) return;
              var d=ln.slice(5).trim();
              if(d==='[DONE]') return;
              var o=null;
              try{ o=JSON.parse(d); }catch(e){}
              if(!o) return;
              if(o.error){   /* 本机桥在流里报错：换成带状态码的异常，让 errText 认得出 */
                var er=new Error(o.error.message||''); er.stream=true;
                er.status = o.error.code==='busy'? 429 : o.error.code==='timeout'? 504 : o.error.code==='no_claude'? 503 : 502;
                throw er;
              }
              if(o.uw){   /* 桥的旁路信息：读网页进度 / 读了哪些网页 */
                if(o.uw.status){ R.status=o.uw.status; if(typeof paint==='function') paint(); }
                if(o.uw.web){ R.web=o.uw.web; }
              }
              var t=((o.choices||[{}])[0].delta||{}).content;
              if(t){ R.status=''; full+=t; onDelta(full); }
            });
            return pump();
          });
        }
        return pump();
      });
  }

  function errText(e){
    var s=e&&e.status, isProxy = (mode()==='proxy');
    if(mode()==='bridge' || (e&&e.stream)){
      if(e&&e.name==='AbortError') return ['已停止', '这次回答被你中断了。'];
      if(s===403) return ['本机桥拒绝了这次请求', '桥只认线上那个地址发来的请求，本地打开的文件和别的网页都会被拒，这是有意的。'];
      if(s===429) return ['本机 Claude 正忙', '你电脑上的 Claude Code 同时只接两个问题。等上一个答完再问。'];
      if(s===503) return ['桥找不到 Claude Code', '桥在跑，但它在你电脑上找不到 claude 命令。先确认终端里敲 claude 能用，再重装一次桥。'];
      if(s===504) return ['本机 Claude 没在时限内答完', '三分钟没答完，桥把它停了。把问题拆小一点再问。'];
      if(s>=500)  return ['本机 Claude 这次没跑成', '最常见的原因是登录过期：在终端敲一次 claude，看看要不要重新登录。'
                          + (e&&e.message? ' 桥报的是：'+String(e.message).slice(0,160) : '')];
      return ['本机桥没响应', '刚才还探到桥，现在连不上了，它可能被关掉了。页面已退回部门共享通道，直接重问一次就行。'];
    }
    if(s===401||s===403){
      return isProxy
        ? ['共享服务暂时用不了', '部门共享的那条通道没放行这次请求。可以先填自己的智谱密钥继续用，'
           + '或者把这条报错告诉做这个页面的人。']
        : ['密钥没通过', '这个密钥被拒了。检查是不是复制时少了字符，或者这个密钥属于另一个平台。'];
    }
    if(s===429)          return isProxy
      ? ['大家问得太密了', '部门共享的这条通道有速率上限，同一时间用的人多就会排到。'
         + '等一会儿再试，或者填自己的智谱密钥走自己的额度。']
      : ['被限流了', '免费额度用完，或者短时间请求太多。等一会儿再试。'];
    if(s===400)          return ['模型名不对', '这个平台上没有当前填的模型名。到设置里换一个，或者填平台文档里写的名字。'];
    if(s===404)          return ['接口地址不对', '设置里的接口地址在这个平台上不存在。'];
    if(s>=500)           return ['平台那边出错了', '不是你的问题，稍后再试。'];
    if(e&&e.name==='AbortError') return ['已停止', '这次回答被你中断了。'];
    return ['请求发不出去', '请求没能送到平台。最常见的原因是公司网络挡了这个域名——'
            + '智谱、硅基流动、DeepSeek 都是国内服务，一般直连可达，但公司代理可能有自己的名单。'
            + '换手机热点试一次就能分清是网络策略还是别的问题。'];
  }

  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  /* ── 跑任务视图 ── */
  var R = { q:'', ans:'', srcs:[], state:'idle', err:null, ctl:null, task:'', turns:[], status:'', web:null };
  function webOkCount(){ return (R.web||[]).filter(function(w){ return w.ok; }).length; }
  function webFailBox(){
    var bad=(R.web||[]).filter(function(w){ return !w.ok; });
    if(!bad.length) return '';
    return '<div class="srcs"><div class="srcs-h">有网页没读到：'+bad.map(function(w){ return escW(w.url)+'（'+escW(w.message||w.error||'')+'）'; }).join('；')+'</div></div>';
  }
  window.WBRUN = R;

  /* 🔴 小模型不听格式类指令 —— prompt 里写了「中英之间加空格」「不要 emoji」，
     它照样输出「有540个状态」和「📝」。所以这两件事在前端机器修，不赌它自觉。
     反引号里的内容原样保留（那里面是代码和 key，加空格会改坏）。 */
  var EMO=/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{1F000}-\u{1F0FF}\u{FE0F}\u{20E3}]/gu;
  function tidy(t){
    return String(t||'').split(/(`[^`]*`)/).map(function(seg,i){
      if(i%2) return seg;                       // 反引号内原样
      return seg.replace(EMO,'')
                .replace(/([\u4e00-\u9fa5])([A-Za-z0-9])/g,'$1 $2')
                .replace(/([A-Za-z0-9])([\u4e00-\u9fa5])/g,'$1 $2')
                .replace(/ {2,}/g,' ');
    }).join('');
  }
  window.wbTidy = tidy;

  /* 🔴 这个函数曾经把浏览器搞崩（3.1 GB 堆、渲染进程被杀）。
     根因：段落分支的 while 条件里用 [-*\d|#] 排除「块的开头」，
     但一行以数字开头（「2026 年…」「540 个状态…」）既不匹配列表格式（要求 1. 后跟空格）、
     也被 while 条件排除 → para 为空、i 不前进 → 无限循环往数组里塞空串 → 吃光内存。
     中文回答里以数字开头的行极常见，所以长回答几乎必崩。

     两道修：① 块开头改成精确判断，不用粗糙字符类
             ② 加循环护栏：无论判据怎么写，每一轮都必须保证 i 前进 */
  function mdToHtml(t){
    t = tidy(t);
    var esc=function(x){ return x.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); };
    var lines=esc(t).split('\n'), out=[], i=0, guard=0, cap=lines.length*4+64;

    function isTable(ln){ return /^\s*\|/.test(ln); }
    function isHead(ln){  return /^#{1,6}\s+\S/.test(ln); }
    function isUl(ln){    return /^\s*[-*+]\s+\S/.test(ln); }
    function isOl(ln){    return /^\s*\d{1,3}[.)]\s+\S/.test(ln); }
    function isBlock(ln){ return isTable(ln)||isHead(ln)||isUl(ln)||isOl(ln); }

    function inline(x){
      return x.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
              .replace(/`([^`]+)`/g,'<code>$1</code>');
    }

    while(i<lines.length){
      if(++guard>cap) break;              // 护栏：判据再怎么错也不会锁死浏览器
      var before=i, ln=lines[i];

      if(!ln.trim()){ i++; continue; }

      if(isTable(ln)){
        var rows=[];
        while(i<lines.length && isTable(lines[i])){
          var cells=lines[i].trim().replace(/^\||\|$/g,'').split('|').map(function(x){return x.trim();});
          if(!cells.every(function(c){ return /^:?-{2,}:?$/.test(c)||c===''; })) rows.push(cells);
          i++;
        }
        if(rows.length){
          out.push('<table><thead><tr>'+rows[0].map(function(c){return '<th>'+inline(c)+'</th>';}).join('')+'</tr></thead><tbody>'
            + rows.slice(1).map(function(r){ return '<tr>'+r.map(function(c,ci){return '<td'+(ci===0?' class="c1"':'')+'>'+inline(c)+'</td>';}).join('')+'</tr>'; }).join('')
            + '</tbody></table>');
        }
        if(i===before) i++;               // 表格没吃掉任何行也要前进
        continue;
      }

      if(isHead(ln)){
        out.push('<h3>'+inline(ln.replace(/^#{1,6}\s+/,''))+'</h3>'); i++; continue;
      }

      if(isUl(ln)||isOl(ln)){
        var ord=isOl(ln), items=[];
        while(i<lines.length && (isUl(lines[i])||isOl(lines[i]))){
          items.push('<li>'+inline(lines[i].replace(/^\s*(?:[-*+]|\d{1,3}[.)])\s+/,''))+'</li>'); i++;
        }
        out.push((ord?'<ol>':'<ul>')+items.join('')+(ord?'</ol>':'</ul>'));
        if(i===before) i++;
        continue;
      }

      // 普通段落：吃到下一个块开头或空行为止
      var para=[];
      while(i<lines.length && lines[i].trim() && !isBlock(lines[i])){ para.push(lines[i]); i++; }
      if(i===before){ para.push(lines[i]); i++; }   // 🔴 兜底：一行都没吃到也强制前进
      out.push('<p>'+inline(para.join(' '))+'</p>');
    }
    return out.join('');
  }

  function qblock(q){
    return '<div class="qbox"><span class="qava">'+(window.fqIcon? fqIcon('personal-f',14)||'' : '')+
      '</span><div class="qtx">'+esc(q)+'</div></div>';
  }
  function pastTurns(){
    /* 已经答完的前几轮，让人看得见对话是连着的 */
    return (R.turns||[]).map(function(t){
      return '<div class="turn">'+qblock(t.q)+
        '<div class="ahead"><b>WorkBuddy</b></div><div class="atx">'+mdToHtml(t.ans)+'</div></div>';
    }).join('');
  }
  function askMoreBox(){
    if(R.state==='run'||R.state==='search'||R.state==='loadkb') return '';
    return '<div class="askmore" id="am"><div class="askin">'+
      '<textarea id="ta2" rows="1" placeholder="接着问 —— 它记得上面聊过什么"'+
        ' oninput="wbAmInput(this)"></textarea>'+
      '<button class="asksend" id="am-send" onclick="wbAskMore()" disabled>'+
        (typeof ic!=='undefined' && ic.wb_send ? ic.wb_send : '↑')+'</button></div>'+

  /* ── 主流程 ── */
  function paint(){ if(S.view==='run') document.getElementById('main').innerHTML = viewRun(); }

  /* 🔴 流式期间不解析 markdown，只往末尾追加纯文本。
     这是第二次修这个地方 —— 第一次我只把频率从「每个 token」降到「每 120ms」，
     但每次仍然重解析全文，复杂度还是平方级：答案越长越卡，
     长输出（比如竞品分析）撞得最狠。现在改成：
       流式中 → textContent 追加，单次开销跟答案长度无关
       生成完 → 一次性解析成 markdown（表格、列表这时才出来）
     代价是流式期间看到的是纯文本、表格不成形，几秒后成形 —— 这个代价换的是不卡。 */
  var streamTimer=null, lastPaint=0, txtEl=null, shown=0;
  function paintStream(){
    if(S.view!=='run') return;
    var now=Date.now(), gap=now-lastPaint;
    if(gap<100){
      if(!streamTimer) streamTimer=setTimeout(function(){ streamTimer=null; paintStream(); }, 110-gap);
      return;
    }
    lastPaint=now;
    if(!txtEl || !txtEl.isConnected){
      var host=document.querySelector('#main .atx');
      if(!host){ paint(); return; }
      host.innerHTML='<div class="raw"></div><span class="caret"></span>';
      txtEl=host.querySelector('.raw'); shown=0;
    }
    if(R.ans.length>shown){
      txtEl.appendChild(document.createTextNode(R.ans.slice(shown)));
      shown=R.ans.length;
    }
  }
  function stopStream(){
    if(streamTimer){ clearTimeout(streamTimer); streamTimer=null; }
    txtEl=null; shown=0;
  }

  function runQuery(q, keepTurns){
    /* 轮次在「开始新一轮」时收进历史，不是在「答完」时收 ——
       答完就 push 会让 pastTurns() 和当前这一轮同时渲染同一条，界面上重复一遍。
       这样 R.turns 永远只装「已经翻页过去的」，当前轮由 R.q / R.ans 单独渲染。 */
    if(!keepTurns){ R.turns=[]; }
    else if(R.q && R.ans){
      R.turns.push({q:R.q, ans:R.ans});
      if(R.turns.length>8) R.turns.shift();
    }
    R.q=q; R.ans=''; R.srcs=[]; R.err=null; R.raw=''; R.status=''; R.web=null;
    S.view='run';
    if(!ready()){ R.state='needkey'; render(); return; }
    /* 寒暄和元问题不检索 —— 不但省掉一次 7.2MB 语料扫描，
       更要紧的是界面不会再列出一堆跟问题无关的文档名
       （那看起来像「在这 9 份文档里找过、确实没有」，其实是随便抓的）。 */
    var kind = chatKind(q);
    R.kind = kind;
    if(webUrlsIn(q).length && !webReady() && window.fqToast){   /* 网址给了但这条路不通，先说清楚，别让人以为它看过 */
      fqToast(mode()==='bridge' ? '要读网页得把本机桥升到'+BRIDGE_WANT+'：设置里有安装命令，重跑一次就行' : '读网页要走本机桥（设置里有装法），这次只按知识库答');
    }
    R.state = (kind==='ask') ? 'loadkb' : 'run'; render();
    (kind==='ask'
      ? loadKB().then(function(){ R.state='search'; paint(); return retrieveAsync(q); })
      : Promise.resolve([])
    ).then(function(chunks){
      R.srcs = chunks || [];
      R.state='run'; paint();
      R.ctl = (window.AbortController? new AbortController() : null);
      return callModel(q, R.srcs, function(full){ R.ans=full; paintStream(); }, R.ctl?R.ctl.signal:undefined, kind);
    }).then(function(){
      stopStream();          // 到这里才做唯一一次完整 markdown 解析（在 paint 里）
      R.state='done';
      if(!R.ans){ R.state='error'; R.err=['没收到内容','平台接受了请求但没返回文字。换个模型或稍后再试。']; }
      paint();
    }).catch(function(e){
      stopStream();
      R.state = (e&&e.name==='AbortError' && R.ans)? 'done' : 'error';
      if(R.state==='error'){ R.err=errText(e); R.raw=(e&&e.message)||''; }
      paint();
    });
  }

  /* 回车发送、Shift + 回车换行。
     🔴 必须判 e.isComposing —— 中文输入法拼字时按回车是「确认候选词」，
     不判的话你打「筛选」按回车选词，消息就被发出去了，句子还只写了一半。
     用事件委托，不去改原始 HTML 里那个 textarea 的属性。 */
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.isComposing || e.keyCode===229) return;      // 229 是老浏览器的输入法组合态
    var t=e.target;
    if(!t || t.tagName!=='TEXTAREA') return;
    if(t.id==='ta'){                                   // 首页输入框
      if(!(S.text||'').trim()) return;

    } else if(t.id==='ta2'){                            // 回答页的追问框

      var c2=document.getElementById('col2'); if(c2) c2.hidden=true;
      document.getElementById('main').innerHTML = viewRun();
      document.getElementById('main').scrollTop=0;
      return;
    }
    origRender();
  };

/* ══════════ 移动端布局层 ══════════ */
(function(){
  var MQ = '(max-width:768px)';
  function onPhone(){ return window.matchMedia(MQ).matches; }

  /* ── 顶栏 + 遮罩：插一次，之后靠 CSS 断点显隐 ── */
  var top = document.createElement('div');

  document.body.insertBefore(top, document.body.firstChild);

  });
  document.getElementById('wbmSet').addEventListener('click', function(e){
    e.stopPropagation(); openDrawer(false);
    if(typeof window.wbSettings === 'function') window.wbSettings();
  });
  scrim.addEventListener('click', function(){ openDrawer(false); });
  /* 左栏里点任何导航都关抽屉 —— 点完停在原地看不到结果，是抽屉最常见的毛病 */
  document.querySelector('.sb').addEventListener('click', function(e){
    if(e.target.closest('button')) setTimeout(function(){ openDrawer(false); }, 90);
  });
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape') openDrawer(false); });

  /* ── 顶栏标题跟着当前页 ── */
  var NAV_NAME = {};
  try{ NAV.forEach(function(r){ NAV_NAME[r[0]] = r[1]; }); }catch(e){}
  function titleNow(){
    if(S.view === 'new')  return 'UED WorkBuddy';
    if(S.view === 'run')  return '任务';
    if(S.view === 'lib'){
      try{ return LIBS[S.lib].n; }catch(e){ return '资料库'; }
    }
    return NAV_NAME[S.view] || 'UED WorkBuddy';
  }

  /* ── 宽表格摊成卡片：把 thead 的列名抄进每个 td 的 data-label ──
     列名不在 CSS 里写死，表结构改了这里自动跟着变。 */
  function labelTables(root){
    var tables = root.querySelectorAll('table.tbl, .atx table');
    for(var i = 0; i < tables.length; i++){
      var t = tables[i];
      if(t.getAttribute('data-wbm') === '1') continue;   /* 幂等：处理过就跳过 */
      var head = t.querySelector('thead tr');
      var names = [];
      if(head){
        var ths = head.children;
        for(var h = 0; h < ths.length; h++) names.push((ths[h].textContent || '').trim());
      }
      var rows = t.querySelectorAll('tbody tr');
      for(var r = 0; r < rows.length; r++){
        var tds = rows[r].children;
        for(var c = 0; c < tds.length; c++){
          var td = tds[c];
          td.setAttribute('data-label', names[c] || '');
          /* 空单元格在卡片里会留一条空行，标出来让 CSS 收掉 */
          if(!(td.textContent || '').trim() && !td.querySelector('svg,img')) td.classList.add('wbm-empty');
          else td.classList.remove('wbm-empty');
        }
      }
      t.setAttribute('data-wbm', '1');
    }
  }

  /* ── 资料库详情页补一个返回 ──
     桌面版是靠中间那栏切库的，手机上中间栏不出现，所以要给一条回去的路。 */
  function backLink(root){
    if(S.view !== 'lib') return;
    var ph = root.querySelector('.page');
    if(!ph || ph.querySelector('.wbm-back')) return;
    var b = document.createElement('button');
    b.className = 'wbm-back';

    b.addEventListener('click', function(){ S.lib = null; go('libs'); });
    ph.insertBefore(b, ph.firstChild);
  }

  /* ── 场景 tab 横滑：把选中的那个滚进视野 ── */
  function scrollTabIntoView(root){
    var on = root.querySelector('.tabs button.on');
    if(!on || !on.parentNode) return;
    var box = on.parentNode;
    if(box.scrollWidth <= box.clientWidth + 2) return;
    box.scrollLeft = on.offsetLeft - (box.clientWidth - on.offsetWidth) / 2;
  }

  function apply(){
    var main = document.getElementById('main');
    if(!main) return;
    var t = document.getElementById('wbmTitle');
    if(t) t.textContent = titleNow();
    if(!onPhone()) return;          /* 桌面宽度下不加工，省掉无用的 DOM 写入 */
    labelTables(main);
    backLink(main);
    scrollTabIntoView(main);
    fixHints();
  }

  /* 观察 main 的整棵子树 —— render() 和流式输出都会命中，
     用 rAF 合并，流式期间每帧最多跑一次。 */
  var pending = false;
  function schedule(){
    if(pending) return;
    pending = true;
    requestAnimationFrame(function(){ pending = false; apply(); });
  }
  new MutationObserver(schedule).observe(document.getElementById('main'),
    {childList:true, subtree:true});
  window.addEventListener('resize', schedule);
  apply();

  /* ── 换页要回到页顶 ──
     桌面版滚的是 main，手机上滚的是文档，原来那两句 main.scrollTop=0 / main.scrollTo
     在手机上是空操作，结果切页之后还停在上一页的位置。 */
  function toTop(smooth){
    if(!onPhone()) return;
    window.scrollTo(smooth ? {top:0, behavior:'smooth'} : {top:0});
  }
  if(typeof go === 'function'){
    var origGo = go;
    go = window.go = function(v){ origGo(v); toTop(false); };
  }
  if(typeof pickCase === 'function'){
    var origPickCase = pickCase;
    pickCase = window.pickCase = function(sc, ci){
      origPickCase(sc, ci);
      if(onPhone()){
        var c = document.querySelector('.cwrap');
        if(c) c.scrollIntoView({block:'center', behavior:'smooth'});
      }
    };
  }

  /* ── 回车键：手机上不发送，只换行 ──
     页面上原有的行为是「回车发送、Shift + 回车换行」，那是给物理键盘定的。
     手机软键盘没有能配合的 Shift，而场景模板本身就是多行、带【】占位符要逐个填，
     一按回车就发出去等于没法在手机上改模板。
     这里用捕获阶段先截住：原来那个监听挂在 document 的冒泡阶段，
     捕获阶段 stopPropagation 就到不了它，回车回落成 textarea 的默认换行。 */
  document.addEventListener('keydown', function(e){
    if(!onPhone()) return;
    if(e.key !== 'Enter' || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if(t && t.tagName === 'TEXTAREA') e.stopPropagation();
  }, true);

  /* 那两句键盘提示在手机上是错的，换成手机上真实的操作 */
  function fixHints(){
    if(!onPhone()) return;
    var ta = document.getElementById('ta');
    if(ta && ta.placeholder.indexOf('回车') >= 0)
      ta.placeholder = ta.placeholder.replace(/（回车发送[^）]*）/, '');
    document.querySelectorAll('.askhint').forEach(function(h){
      if(h.textContent.indexOf('回车') >= 0) h.textContent = '写完点右边的发送键';
    });
  }

  /* ── 悬停触发改成点击触发 ──
     触屏没有 hover。这两处桌面版都只靠 CSS :hover，手机上等于点不开。 */
  document.addEventListener('click', function(e){
    if(!onPhone()) return;

    /* + 菜单的一级项：点开二级 */
    var row = e.target.closest('.pitem > .row');
    if(row){
      var item = row.parentNode, was = item.classList.contains('wbm-on');
      var sibs = item.parentNode.querySelectorAll('.pitem');
      for(var i = 0; i < sibs.length; i++) sibs[i].classList.remove('wbm-on');
      if(!was) item.classList.add('wbm-on');
      e.stopPropagation();
      return;
    }

    /* 附件标签：点一下看大图，再点收起（点 × 不算） */
    var chip = e.target.closest('.filechip');
    if(chip && !e.target.closest('.x')){
      if(chip.querySelector('.fprev')) chip.classList.toggle('wbm-on');
      e.stopPropagation();
      return;
    }
    var opened = document.querySelector('.filechip.wbm-on');
    if(opened) opened.classList.remove('wbm-on');
  }, true);
})();

var UWT = { ws:null, term:null, fit:null, loaded:false, sid:null, dir:null,

function uwtCan(){
  var B = uwtBridge();

  if(!t) return { external:false, builtin:false, stale:true,
    why:'桥是旧版'+(B.info.version||'1.0.0')+'，这个功能要'+(window.wbBridgeWant||'新版')+'：重跑一次安装命令就有' };
  return { external:!!t.external, builtin:!!t.ok, why:t.reason || '', root:t.workRoot || '' };

/* ── 选择界面 ─────────────────────────────────────────
   文案形式参考 foder Studio：每条给「名字 + 在哪执行 + 一句代价」。

window.wbHandoff = function(payload){

  var c = uwtCan(), live = null;
  uwtSessions().then(function(list){
    live = (list && list.length) ? list[0] : null;
    uwtRenderChooser(c, live);
  }, function(){ uwtRenderChooser(c, null); });
  document.getElementById('uwtMask').classList.add('uwt-on');
};
function uwtRenderChooser(c, live){

  H.push('<div class="uwt-opts">');

  if(live){
    H.push(uwtOpt('back', '接回正在跑的那个终端', '「' + uwtEsc(live.title || '终端') + '」还开着'

  }

function uwtOpt(icon, t1, t2, t3, dis, onclick, rec){

function uwtEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){

/* ── 打到桥上 ───────────────────────────────────────── */
function uwtSessions(){
  var B = uwtBridge();
  if(!B || !B.ok) return Promise.resolve([]);
  return fetch(B.url + '/terminal/sessions', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(j){ return (j && j.sessions) || []; })
    .catch(function(){ return []; });
}
function uwtGo(method){
  var B = uwtBridge(), p = UWT.payload || {};
  if(!B || !B.ok){ if(window.fqToast) fqToast('没连上你电脑上的Claude Code'); return; }
  uwtCloseChooser();

  if(method === 'attach'){
    uwtSessions().then(function(list){
      if(!list.length){
        uwtKillUI();
        if(window.fqToast) fqToast('那个终端已经结束了');
        return;
      }
      fetch(B.url + '/terminal/attach', { method:'POST',
        headers:{ 'content-type':'application/json' },
        body: JSON.stringify({ sessionId: list[0].id }) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if(j && j.ok) uwtOpenDrawer(j, true); else uwtFail(j); });
    });
    return;
  }

  var body = {
    method: method,
    task: p.task || p.card || '任务',
    card: p.card || '', scene: p.scene || '',
    prompt: p.prompt || '', docs: p.docs || [], out: p.out || [],
    skills: p.skills || [], file: p.file || ''
  };
  if(method === 'builtin'){ body.cols = 100; body.rows = 30; }
  if(window.fqToast) fqToast(method === 'external' ? '正在打开终端…' : '正在起终端…');

  fetch(B.url + '/launch', { method:'POST', headers:{ 'content-type':'application/json' },
                             body: JSON.stringify(body) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || (!j.ok && !j.dir)) return uwtFail(j);
      if(method === 'builtin'){ if(j.ok) uwtOpenDrawer(j, false); else uwtFail(j); return; }
      /* 系统终端：桥已经把窗口开出来了，页面只负责说清去哪儿看 */
      if(j.ok) uwtDone(j);
      else uwtFail(j, j.manual);
    })
    .catch(function(e){ uwtFail({ error:{ message: e && e.message || '连不上桥' } }); });
}
function uwtDone(j){
  var where = j.terminal ? ('已经在' + j.terminal + '里开好了') : '已经开好了';
  if(window.fqToast) fqToast(where + ' · 任务单在' + (j.rel || j.dir));
}
function uwtFail(j, manual){
  var m = (j && j.error && j.error.message) || '没能拉起终端';
  if(window.fqToast) fqToast(manual ? (m + '。自己开终端敲：' + manual) : m);
}

/* ── 页面内终端 ─────────────────────────────────────
   xterm.js 自托管在 vendor/xterm/，不走 cdnjs：
   公司网络可能拦外部 CDN，而这会是页面唯一的外部依赖来源，拦了整个终端就没了。
   点了才加载（289KB），别拖首屏。 */
function uwtLoadXterm(){
  if(UWT.loaded) return Promise.resolve(true);
  return new Promise(function(res){
    var base = 'vendor/xterm/';
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = base + 'xterm.css';
    document.head.appendChild(css);
    var s = document.createElement('script');
    s.src = base + 'xterm.js';
    s.onerror = function(){ res(false); };
    s.onload = function(){
      var f = document.createElement('script');
      f.src = base + 'addon-fit.js';
      f.onerror = function(){ res(false); };
      f.onload = function(){ UWT.loaded = true; res(true); };
      document.head.appendChild(f);
    };
    document.head.appendChild(s);
  });
}
/* ── 分区开关与分隔条 ───────────────────────────────
   开终端 = 给 <html> 挂 .uwt-split，主内容和向导弹层一起收窄；关掉就摘掉。
   宽度只有 --uwt-w 一个源，拖分隔条改它，抽屉和被收窄的两边同时跟着变。 */
function uwtSplitOn(){
  document.documentElement.classList.add('uwt-split');
  var w = null; try { w = localStorage.getItem('wb.term.w'); } catch(e){}
  if(w) document.documentElement.style.setProperty('--uwt-w', w);
  uwtFit();
}
function uwtSplitOff(){ document.documentElement.classList.remove('uwt-split'); }
/* 拖分隔条。上下限：终端不小于 380（80 列放不下就没意义），
   左边至少留 520（少于这个数向导弹层就没法看了）。 */
function uwtGripInit(){
  var g = document.getElementById('uwtGrip');
  if(!g || g.dataset.on) return;
  g.dataset.on = '1';
  g.addEventListener('mousedown', function(e){
    e.preventDefault();
    g.classList.add('uwt-drag');
    document.documentElement.classList.add('uwt-dragging');
    function move(ev){
      var w = window.innerWidth - ev.clientX;
      w = Math.max(380, Math.min(w, window.innerWidth - 520));
      document.documentElement.style.setProperty('--uwt-w', w + 'px');
      uwtFit();
    }
    function up(){
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      g.classList.remove('uwt-drag');
      document.documentElement.classList.remove('uwt-dragging');
      try { localStorage.setItem('wb.term.w',
        getComputedStyle(document.documentElement).getPropertyValue('--uwt-w').trim()); } catch(e){}
      uwtFit();
    }
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

function uwtOpenDrawer(j, isAttach){
  document.getElementById('uwtDrawer').classList.add('uwt-on');
  uwtSplitOn();
  uwtGripInit();
  document.getElementById('uwtBoot').hidden = false;
  document.getElementById('uwtBoot').textContent = '正在起终端…';
  UWT.dir = j.rel || j.dir || '';
  /* 从右边缘把手接回来时没走向导、payload 是空的 —— 用会话自己的标题兜住，
     别让标题栏显示 undefined */
  uwtHead((UWT.payload && UWT.payload.card) || (UWT.live && UWT.live.title) || '终端', UWT.dir, null);
  uwtLoadXterm().then(function(ok){
    if(!ok){
      document.getElementById('uwtBoot').textContent =
        '终端界面没加载出来（vendor/xterm/ 取不到）。改用「打开系统终端」那条路。';
      return;
    }
    uwtMakeTerm();
    uwtConnect(j, isAttach);
  });
}
function uwtMakeTerm(){
  if(UWT.term) return;
  var narrow = window.matchMedia && window.matchMedia('(max-width:760px)').matches;
  UWT.term = new window.Terminal({
    fontSize: narrow ? 11 : 13,
    fontFamily: 'SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace',
    lineHeight: 1.25, cursorBlink: true, scrollback: 5000,
    /* 底色跟 .uwt-dbody 一致（#1D1D1F），不然滚到底会露出 xterm 自己的黑 */
    theme: { background:'#1D1D1F', foreground:'#F5F5F7', cursor:'#F5F5F7',
             selectionBackground:'rgba(255,255,255,.22)' }
  });
  UWT.fit = new window.FitAddon.FitAddon();
  UWT.term.loadAddon(UWT.fit);
  UWT.term.open(document.getElementById('uwtXt'));
  /* 抽屉宽度变了（转屏 / 缩窗口）要重算列数，不然 CC 的框线会断 */
  if(window.ResizeObserver){
    UWT.ro = new ResizeObserver(function(){ uwtFit(); });
    UWT.ro.observe(document.getElementById('uwtBody'));
  } else window.addEventListener('resize', uwtFit);
}
function uwtFit(){
  if(!UWT.fit || !UWT.term) return;
  try { UWT.fit.fit(); } catch(e){ return; }
  if(UWT.ws && UWT.ws.readyState === 1)
    UWT.ws.send(JSON.stringify({ type:'resize', cols:UWT.term.cols, rows:UWT.term.rows }));
}
function uwtConnect(j, isAttach){
  var port = j.port || 17331;
  var ws;
  try { ws = new WebSocket('ws://127.0.0.1:' + port + j.wsPath); }
  catch(e){ document.getElementById('uwtBoot').textContent = '连不上本机终端：' + e.message; return; }
  UWT.ws = ws;
  ws.onopen = function(){ uwtFit(); };
  ws.onmessage = function(ev){
    var d; try { d = JSON.parse(ev.data); } catch(e){ return; }
    if(d.type === 'ready'){
      UWT.sid = d.sessionId; UWT.alive = true;
      UWT.dir = d.rel || UWT.dir;      /* 用子目录名不用绝对路径 —— 标题栏只有 38% 宽 */
      document.getElementById('uwtBoot').hidden = true;
      uwtHead(d.title || '终端', UWT.dir, d.busy);
      uwtFit();
      if(!d.replay) uwtFirstRunHint();
    } else if(d.type === 'output'){
      UWT.term.write(d.data);
    } else if(d.type === 'title'){
      uwtHead(d.title, UWT.dir, d.busy);
    } else if(d.type === 'exit'){
      UWT.alive = false;
      uwtHead(null, UWT.dir, 'dead');
      UWT.term.write('\r\n\x1b[38;5;244m[ 这个终端结束了' +
        (d.exitCode ? '（退出码' + d.exitCode + '）' : '') + ' ]\x1b[0m\r\n');
    } else if(d.type === 'error'){
      document.getElementById('uwtBoot').hidden = false;
      document.getElementById('uwtBoot').textContent = d.message || '终端出错了';
    }
  };
  ws.onclose = function(){ UWT.alive = false; uwtHead(null, UWT.dir, 'dead'); };
  ws.onerror = function(){
    if(!UWT.sid){
      document.getElementById('uwtBoot').hidden = false;
      document.getElementById('uwtBoot').textContent =
        '连不上本机终端。桥可能刚重启过 —— 关掉重新选一次。';
    }
  };
  /* 键盘、粘贴都从这里进 pty。xterm 会自己处理 CC 开的 bracketed paste（?2004h）。 */
  UWT.term.onData(function(data){
    if(ws.readyState === 1) ws.send(JSON.stringify({ type:'input', data:data }));
  });
}
/* 第一次用会撞 Claude Code 的目录信任确认，而它默认高亮在「No, exit」上 ——
   回车就退出了。工作目录固定成同一个，所以这一屏一辈子只出现一次；
   但那一次必须提前说，不然同事以为坏了。 */
function uwtFirstRunHint(){
  var k = 'wb.term.trusted';
  var seen = false; try { seen = localStorage.getItem(k) === '1'; } catch(e){}
  if(seen) return;
  document.getElementById('uwtTip').innerHTML =
    '第一次会问 <b>Is this a project you trust?</b> —— 按 <b>↓</b> 选'
    + '<b>Yes, I trust this folder</b> 再回车。默认那项是No，直接回车会退出。这一屏只出现一次。';
  try { localStorage.setItem(k, '1'); } catch(e){}
}
function uwtHead(title, dir, busy){
  if(title != null) document.getElementById('uwtDt').textContent = title;
  document.getElementById('uwtDsub').textContent = dir || '';
  var dot = document.getElementById('uwtDot');
  dot.className = 'uwt-dot' + (busy === 'dead' ? ' uwt-dead' : busy ? ' uwt-run' : '');
}
function uwtPasteTask(){
  var t = (UWT.payload && UWT.payload.prompt) || '';
  if(!t || !UWT.ws || UWT.ws.readyState !== 1) return;
  /* 走 paste 而不是 input：桥那边会套 bracketed paste，
     不套的话多行文本的每个换行都被 CC 当回车提交，一段话被切成十几次提问。 */
  UWT.ws.send(JSON.stringify({ type:'paste', data:t }));
  if(window.fqToast) fqToast('任务单已粘进终端，回车发出去');
}
/* 收起 ≠ 结束：只断开页面这一头，CC 还在跑（桥那边留 30 分钟，回来能接上）。 */
function uwtHide(){
  document.getElementById('uwtDrawer').classList.remove('uwt-on');
  uwtSplitOff();
  if(UWT.ws){ try { UWT.ws.close(); } catch(e){} UWT.ws = null; }
  /* 收起 ≠ 结束，所以收起之后必须留一条回去的路。桥那边会话还留 30 分钟。 */
  uwtCheckLive();
}
function uwtKillUI(){
  var b = document.getElementById('uwtReopen');
  if(b) b.classList.remove('uwt-on');
}
/* 桥上还有活着的会话吗？有就亮出右边缘那个把手。
   刷新页面之后也走这条 —— 不然刷一下就再也回不去了。 */
function uwtCheckLive(){
  return uwtSessions().then(function(list){
    var b = document.getElementById('uwtReopen');
    if(!b) return;
    var open = document.getElementById('uwtDrawer').classList.contains('uwt-on');
    if(!list.length || open){ b.classList.remove('uwt-on'); return; }
    var s = list[0];
    UWT.live = s;
    document.getElementById('uwtRlabel').textContent = (s.title || '终端') + '还在跑';
    document.getElementById('uwtRdot').className = 'uwt-rdot' + (s.busy ? ' uwt-run' : '');
    b.classList.add('uwt-on');
    b.title = '回到「' + (s.title || '终端') + '」' + (s.rel ? '（' + s.rel + '）' : '');
  });
}
function uwtReopen(){
  document.getElementById('uwtReopen').classList.remove('uwt-on');
  uwtGo('attach');
}
function uwtKill(){
  if(UWT.ws && UWT.ws.readyState === 1) UWT.ws.send(JSON.stringify({ type:'close' }));
  UWT.sid = null; UWT.alive = false;
  document.getElementById('uwtDrawer').classList.remove('uwt-on');
  uwtSplitOff();
  if(UWT.ws){ try { UWT.ws.close(); } catch(e){} UWT.ws = null; }
  uwtKillUI();          /* 真结束了就别再亮把手 */
}
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape' && document.getElementById('uwtMask').classList.contains('uwt-on')) uwtCloseChooser();
});
/* 窗口宽度变了要重算列数：46vw 是相对视口的，缩窗口时抽屉自己会变窄 */
window.addEventListener('resize', function(){
  if(document.documentElement.classList.contains('uwt-split')) uwtFit();
});
/* 页面一打开、以及之后每 30 秒，看桥上有没有还活着的会话。
   刷新页面丢的只是这一头的连接，活还在跑 —— 不查就再也回不去了。 */
(function(){
  function tick(){
    var B = window.wbBridge;
    if(B && B.ok && !document.getElementById('uwtDrawer').classList.contains('uwt-on')) uwtCheckLive();
  }
  setTimeout(tick, 2500);
  setInterval(tick, 30000);
})();

/* 飞鹊 yes2.svg 的真实 path（295 个 SVG 里的纯勾，另外 yes / yes-f 都带圆圈）。
   原来 checkbox 的勾是用 border + rotate(40deg) 拼的，不是飞鹊那一笔。 */
const FQ_YES = '<svg class="wz-ck" viewBox="0 0 16 16" fill="none" aria-hidden="true">'
  + '<path d="M1.98836 6.94178L1.28125 7.64889L6.231 12.5986L14.7163 4.11336'
  + 'L14.0092 3.40625L6.231 11.1844L1.98836 6.94178Z" fill="currentColor"/></svg>';

let W = { open:false, key:null, step:0, ans:{}, rows:[], hits:[], state:'idle', tok:0, fold:false };

function wzKey(sceneId, ci){ return sceneId+'/'+ci; }
function wzDef(){ return WIZ[W.key]; }
function wzCard(){ const [sid,ci]=W.key.split('/'); return sceneById(sid).cards[+ci]; }
function wzScene(){ return sceneById(W.key.split('/')[0]); }
function wzAllQs(){ return wzDef().steps.reduce((a,s)=>a.concat(s.qs),[]); }
function wzFilled(q){
  const v=W.ans[q.k];
  return Array.isArray(v) ? v.length>0 : !!(v&&String(v).trim());
}
function wzEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function wzOpen(sceneId, ci){
  const k=wzKey(sceneId,ci);
  if(!WIZ[k]) return false;                     // 没登记的卡片不弹，照旧只填模板
  W={ open:true, key:k, step:0, ans:{}, rows:[], hits:[], state:'idle', tok:W.tok+1, fold:false };
  document.getElementById('wizmask').classList.add('wzon');
  wzDraw();
  return true;
}
function wzClose(){
  const n=wzAllQs().filter(wzFilled).length;
  /* 填了东西再关，问一句 —— 关掉就没了 */
  if(n && !confirm('已填写'+n+'项，关闭后不保留。确定放弃？')) return;
  W.tok++; W.open=false;
  document.getElementById('wizmask').classList.remove('wzon');
  document.getElementById('wizpeek').classList.remove('wzon');
  /* 模板早就填进输入框了，关掉向导可以直接自己改着打 */
}

function wzDraw(){
  const d=wzDef(), c=wzCard(), sc=wzScene(), st=d.steps[W.step];
  document.getElementById('wzTag').textContent = sc.name;
  document.getElementById('wzT').textContent   = c.n;

  document.getElementById('wzMain').innerHTML = `
    ${W.step===0 ? wzAutoHTML() : ''}
    <div class="wz-q">
      <div class="wz-qn">第${W.step+1}步 / 共${d.steps.length}步</div>
      <div class="wz-qt">${st.t}</div>
      <div class="wz-qh">${st.h||''}</div>
      ${st.qs.map((q,i)=>wzQHTML(q,i)).join('')}
    </div>`;

  wzRail(); wzSide(); wzProg();
  const last = W.step===d.steps.length-1;
  /* 🔴 最后一步隐藏「下一步」。原来它改文案成「完成填写」，可wzNext() 里
     `W.step < steps.length-1` 才前进 —— 那一步点它什么也不会发生，是个死按钮。
     每一步只留一个主操作：前三步是「下一步」，最后一步是「交给 WorkBuddy 回答」。 */
  document.getElementById('wzNext').hidden = last;
  document.getElementById('wzPrev').style.visibility = W.step>0 ? 'visible' : 'hidden';
  document.getElementById('wzAsk').hidden = !last;
  document.getElementById('wzCopy').hidden = !last;
  document.getElementById('wzMain').scrollTop=0;
  if(W.step===0 && W.state==='idle') wzAuto();
}
function wzGo(i){ if(i<=W.step || wzAllQs().length){ W.step=i; wzDraw(); } }
/* 左侧步骤栏：每一步下面挂着这一步已经定下来的答案 ——
   参考 CE 的做法「每一步交一份耐久产物」，走到第 3 步时前两步定了什么一眼可见，不用翻回去。 */
function wzRail(){
  const d=wzDef();
  document.getElementById('wzRail').innerHTML = d.steps.map((s,i)=>{
    const done=i<W.step, on=i===W.step;
    const got=(s.qs||[]).filter(wzFilled).map(q=>{ let v=W.ans[q.k]; if(Array.isArray(v)) v=v.join('、'); return wzEsc(String(v)); });
    return `<button class="wzs ${on?'wzon':(done?'wzdone':'')}" onclick="wzGo(${i})">
      <span class="i">${done?FQ_YES:i+1}</span>
      <span class="wzs-tx"><span class="wzs-tt">${s.t}</span>${got.length?`<span class="wzs-got">${got.map(g=>`<span>${g}</span>`).join('')}</span>`:''}</span>
    </button>`;
  }).join('');
}

/* ── 「已经替你查了」：真查 ───────────────────────────── */
function wzAutoHTML(){
  const d=wzDef(), done=W.state==='done';
  const rows = W.rows.length ? W.rows : d.auto.map(a=>({label:a.label,state:'',detail:''}));
  const miss = rows.filter(r=>r.state==='miss').length;
  return `<div class="wz-auto ${miss?'bad':''} ${done&&W.fold?'fold':''}" id="wzAuto">
    <button class="wz-ah" onclick="wzFold()">
      ${done?'<span class="ok">'+FQ_YES+'</span>':'<span class="wzspin"></span>'}
      <span>${done ? (miss? '检索完成，其中'+miss+'项无匹配' : '以下资料已完成知识库检索')
                   : '正在检索知识库'}</span>
      <span class="real">实时检索</span>
      <span class="wzn">${rows.length}项${done?(W.fold?' · 展开':' · 收起'):''}</span>
    </button>
    <ul class="wz-al">${rows.map(r=>`<li class="${r.state||''}">
      <span class="wzd"></span>
      <span class="bd">${r.label}${r.detail?`<span class="wz-dt">${r.detail}</span>`:''}</span>
    </li>`).join('')}</ul>
  </div>`;
}
function wzFold(){ if(W.state!=='done') return; W.fold=!W.fold; wzRepaintAuto(); }
function wzRepaintAuto(){
  const el=document.getElementById('wzAuto'); if(!el) return;
  el.outerHTML = wzAutoHTML();
}
/* 🔴 向导必须自己加载知识库，不能靠 window.wbRetrieve 顺手带起来。
   实测过：index.html 里一个 <script src> 都没有，kb-search.js 和 kb.js
   全是 WorkBuddy 在闭包里动态插的，而那个 loadKB 没暴露到 window。
   wbRetrieve 只做检索、假设 WBKB 已经在了 —— 直接调它会静默返回 0 段，
   于是绿条上三条全报「没查到」，看起来像知识库里真没有。假红比不跑更坏。 */
let wzKBp = null;
function wzLoadKB(){
  if(wzKBp) return wzKBp;
  wzKBp = new Promise((res,rej)=>{
    if(window.WBKB && window.WBSearch) return res(true);
    function one(src){
      return new Promise((ok,no)=>{
        const s=document.createElement('script');
        s.src=src; s.onload=ok; s.onerror=()=>no(new Error('同目录找不到'+src));
        document.head.appendChild(s);
      });
    }
    one('kb-search.js').then(()=>one('kb.js')).then(()=>{
      if(window.WBKB && window.WBSearch) res(true);
      else rej(new Error('kb.js加载了但WBKB / WBSearch没挂上'));
    }).catch(rej);
  });
  return wzKBp;
}

async function wzAuto(){
  const tok=W.tok, alive=()=>tok===W.tok && W.open && W.step===0;
  const d=wzDef();
  W.state='running'; W.hits=[];
  W.rows = d.auto.map(a=>({label:a.label, state:'', detail:''}));
  wzRepaintAuto();

  /* 知识库 7.6MB，第一次用到才加载 */
  let kbErr = null;
  try{ await wzLoadKB(); }catch(e){ kbErr = e.message || String(e); }
  if(!alive()) return;

  for(let i=0;i<d.auto.length;i++){
    const job=d.auto[i];
    if(!alive()) return;
    let hits=[];
    if(kbErr){
      /* 分清「知识库没打开」和「知识库里没有」—— 两件事，话不能说成一样 */
      W.rows[i].state='miss';
      W.rows[i].detail='<b>未执行</b> · '+wzEsc(kbErr)
        +'（页面需与kb.js、kb-search.js置于同一目录）';
      wzRepaintAuto();
      continue;
    }
    try{ hits = window.WBSearch.retrieve(window.WBKB, job.q, 2600) || []; }
    catch(e){ hits=[]; }
    if(!alive()) return;
    W.hits = W.hits.concat(hits);
    if(!hits.length){
      /* 🔴 查不到就说查不到。原来那份 demo 不管有没有都打勾 —— 那是一句没做到的承诺。 */
      W.rows[i].state='miss';
      W.rows[i].detail='<b>无匹配</b> · 知识库中没有相关段落（关键词：'+wzEsc(job.q)+'）';
    }else{
      const docs=[]; hits.forEach(h=>{ if(docs.indexOf(h.d)<0) docs.push(h.d); });
      W.rows[i].state='ok';
      W.rows[i].detail='检索到'+hits.length+'段 · '
        + docs.slice(0,4).map(x=>`<a class="wz-doc" href="#" onclick="return wzPeek('${wzEsc(x).replace(/'/g,"\\'")}')">${wzEsc(x)}</a>`).join('')
        + (docs.length>4? `<span class="wz-more">还有${docs.length-4}份</span>`:'');
    }
    wzRepaintAuto();
  }
  if(!alive()) return;
  W.state='done';
  /* 有没查到的就不收起 —— 那条恰恰是需要人看见的 */
  W.fold = W.rows.every(r=>r.state==='ok');
  wzRepaintAuto();
}
/* 点文档名看原文。不给原文的「参考了 N 份文档」是假线索。 */
function wzPeek(d){
  const box=document.getElementById('wizpeek');
  const hit=W.hits.filter(h=>h.d===d)[0];
  box.innerHTML=`<div class="wz-ph"><b>${wzEsc(d)}</b>${hit&&hit.t?`<span class="wzst">${wzEsc(hit.t)}</span>`:''}
      <button class="wzx" onclick="document.getElementById('wizpeek').classList.remove('wzon')">&times;</button></div>
    <div class="wz-pb">${hit? wzEsc(hit.x).replace(/\n/g,'<br>') : '（该段原文未保留）'}</div>`;
  box.classList.add('wzon');
  return false;
}

/* ── 问题 ───────────────────────────────────────────── */
function wzQHTML(q,i){
  const v=W.ans[q.k];
  let body='';
  if(q.type==='text')
    body=`<input type="text" class="${v?'has':''}" oninput="wzSet('${q.k}',this.value,this)"
      value="${wzEsc(v||'')}" placeholder="${wzEsc(q.ph||'')}">`;
  else if(q.type==='area')
    body=`<textarea rows="3" class="${v?'has':''}" oninput="wzSet('${q.k}',this.value,this)"
      placeholder="${wzEsc(q.ph||'')}">${wzEsc(v||'')}</textarea>`;
  else{
    const multi = q.type==='check';
    body=`<div class="wz-opts">${q.opts.map(o=>{
      const on = multi ? (v||[]).includes(o[0]) : v===o[0];
      return `<label class="wz-opt ${multi?'':'rd'} ${on?'wzon':''}"
        onclick="wzPickOpt('${q.k}',${multi?1:0},this)" data-v="${wzEsc(o[0])}">
        <span class="bx">${multi?FQ_YES:''}</span><span>${wzEsc(o[0])}${o[1]?`<span class="od">${wzEsc(o[1])}</span>`:''}</span>
      </label>`;
    }).join('')}</div>`;
  }
  return `<div class="wz-item">
    <div class="wz-lbl"><span class="no">${i+1}.</span><span>${wzEsc(q.q)}</span></div>
    ${q.hint?`<div class="wz-hint">${wzEsc(q.hint)}</div>`:''}
    ${body}</div>`;
}
function wzSet(k,v,el){
  W.ans[k]=v;
  if(el) el.classList.toggle('has', !!String(v).trim());
  wzRail(); wzSide(); wzProg();       /* 🔴 只重画左右两栏和计数，不重画整个 main —— 否则输入框会失焦 */
}
function wzPickOpt(k,multi,el){
  const v=el.dataset.v;
  if(multi){
    const cur=W.ans[k]||[];
    const i=cur.indexOf(v);
    W.ans[k] = i<0 ? cur.concat([v]) : cur.filter(x=>x!==v);
    el.classList.toggle('wzon', W.ans[k].includes(v));
  }else{
    W.ans[k]=v;
    [...el.parentNode.children].forEach(x=>x.classList.toggle('wzon', x===el));
  }
  wzRail(); wzSide(); wzProg();
}

/* ── 右侧任务单 ─────────────────────────────────────── */
function wzSide(){
  const d=wzDef(), c=wzCard(), sc=wzScene(), all=wzAllQs();
  const f=all.filter(wzFilled), b=all.filter(q=>!wzFilled(q));
  const pct = all.length ? Math.round(f.length/all.length*100) : 0;
  document.getElementById('wzSide').innerHTML=`
    <div class="rcpt-t">任务单</div>
    <div class="rcpt-sub">${wzEsc(sc.name)} / ${wzEsc(c.n)}</div>
    <div class="rc-sum"><i class="rc-bar"><b style="width:${pct}%"></b></i><span class="lb">确定</span><span class="wzn">${f.length} / ${all.length}</span></div>

    <div class="rcpt-div">这一单会交出</div>
    <ul class="rc-out">${d.out.map(o=>`<li>${wzEsc(o)}</li>`).join('')}</ul>

    <div class="rcpt-div">确定</div>
    ${f.length ? `<ul class="rc-list">${f.map(q=>{
        let v=W.ans[q.k]; if(Array.isArray(v)) v=v.join('、');
        return `<li class="rc-item"><span class="mk">${FQ_YES}</span><span>
          <span class="wznm">${wzEsc(q.q)}</span><span class="vl">${wzEsc(v)}</span></span></li>`;
      }).join('')}</ul>`
      : '<p class="rc-empty">尚未确定任何一项。左侧填写后，此处同步生成。</p>'}

    ${b.length?`<div class="rcpt-div">待定</div>
    <ul class="rc-list">${b.map(q=>`<li class="rc-item off"><span class="mk">&#9675;</span>
      <span><span class="wznm">${wzEsc(q.q)}</span></span></li>`).join('')}</ul>`:''}

    <div class="rcpt-div">调用的能力</div>
    <ul class="rc-kit">${d.skills.map(k=>`<li><span class="sn">${wzEsc(k[0])}</span>
      ${k[1]?`<span class="wzsw">${wzEsc(k[1])}</span>`:''}</li>`).join('')}</ul>`;
}
function wzProg(){
  const all=wzAllQs(), n=all.filter(wzFilled).length;
  document.getElementById('wzProg').textContent='确定'+n+' / '+all.length;
  document.getElementById('wzAsk').disabled = n===0;
}

/* ── 填完之后 ───────────────────────────────────────── */
/* 拼成一段给 WorkBuddy 自己问的话。
   🔴 待定项必须写进去 —— 不写，模型会拿默认假设替你补上，
      而问题不会消失，只会推迟到验收那天一起爆出来。 */
function wzText(forModel){
  const d=wzDef(), c=wzCard(), sc=wzScene(), all=wzAllQs();
  const f=all.filter(wzFilled), b=all.filter(q=>!wzFilled(q));
  const L=[];
  L.push('我要做「'+sc.name+' · '+c.n+'」。');
  L.push('');
  L.push('已经确定的：');
  f.forEach(q=>{
    let v=W.ans[q.k]; if(Array.isArray(v)) v=v.join('、');
    L.push('- '+q.q+' ' + v);
  });
  if(b.length){
    L.push('');
    L.push('还没定的'+b.length+'项（不要替我拿默认假设补上，需要问PM或业务的直接标出来）：');
    b.forEach(q=>L.push('- '+q.q));
  }
  L.push('');
  L.push('要交出：'+d.out.join('；'));
  if(!forModel){
    L.push('');
    L.push('用这些能力：'+d.skills.map(k=>k[0]).join('、'));
    L.push('产出落到'+d.file);
    const docs=[]; W.hits.forEach(h=>{ if(docs.indexOf(h.d)<0) docs.push(h.d); });
    if(docs.length){
      L.push('');
      L.push('向导已经在知识库里查到这些相关文档（'+docs.length+'份）：');
      docs.forEach(x=>L.push('- '+x));
    }
  }
  return L.join('\n');
}
/* 交给 WorkBuddy 自己回答 —— 这是底座换成 WorkBuddy 才有的一步。
   那份 demo 填完只能复制到别处去，因为它手里没有知识库也没有模型。 */
function wzAsk(){
  const q=wzText(true);
  const [sid,ci]=W.key.split('/');
  W.open=false; W.tok++;
  document.getElementById('wizmask').classList.remove('wzon');
  document.getElementById('wizpeek').classList.remove('wzon');
  S.scene=sid; S.sel=+ci; S.text=q; S.chips=[{n:wzCard().n, i:wzCard().i}];
  window.wbRun(q);
}
/* 收尾：不再直接送进页面内问答，改成先问「交给谁做」。
   三条路的差别不是「换个地方回答」—— 前两条拉起的是完整 Claude Code（有工具、有技能、
   有门），第三条是页面内问答（关了全部工具）。差别写在选择界面里，见 patch-terminal.py。
   桥不在 / 那一层没注入时退回原来的行为，别把人卡在这一步。 */
function wzHandoff(){
  var d = wzDef(), c = wzCard(), sc = wzScene();
  if(typeof window.wbHandoff !== 'function'){ wzAsk(); return; }
  var docs = []; W.hits.forEach(function(h){ if(docs.indexOf(h.d) < 0) docs.push(h.d); });
  var q = wzText(true);
  window.wbHandoff({
    task: c.n, card: c.n, scene: sc.name,
    prompt: q, chars: q.length,
    docs: docs, out: d.out || [], skills: d.skills || [], file: d.file || ''
  });
}
async function wzCopy(){
  const t=wzText(false);
  const tip=document.getElementById('wzTip');
  try{ await navigator.clipboard.writeText(t); tip.textContent='已复制'+t.length+'字'; }
  catch(e){
    /* 本地 file:// 下剪贴板可能被拦。别只说失败，把文本摊出来让人手动选。 */
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.cssText='position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);'
      +'width:min(680px,90vw);height:50vh;z-index:300;padding:14px;font-size:12px;border-radius:8px';
    document.body.appendChild(ta); ta.select();
    ta.onblur=()=>ta.remove();
    tip.textContent='浏览器已阻止自动复制，请按Cmd+C手动复制';
  }
}

/* ── 接到 WorkBuddy 的卡片点击上 ─────────────────────── */
/* 保留原来的 pick()：模板照旧填进输入框，所以关掉向导可以直接自己改着打。
   熟手那条快路不拿走，向导是给「不知道该说到什么程度」的人。 */
(function(){
  const orig = window.pick || pick;
  window.pick = function(x){
    orig(x);
    wzOpen(S.scene, x);
  };
  const origCase = window.pickCase || pickCase;
  window.pickCase = function(sc, ci){
    origCase(sc, ci);
    wzOpen(sc, ci);
  };
})();

document.addEventListener('keydown', e=>{
  if(!W.open) return;
  if(e.key==='Escape') wzClose();
});

function wzNext(){
  const d=wzDef();
  if(W.step < d.steps.length-1){ W.step++; wzDraw(); }
}

/* ==WB-WIZ-JS:END== */
</script>
