<!-- 添加到主屏幕：iOS 主屏幕不认 SVG 图标，必须给 PNG。
     图标是满幅的（没自己画圆角）—— iOS 和 Android 都会套自己的遮罩，
     自己再画一层就成了圆角套圆角。图形占画布 60%，落在 Android maskable 的安全圈内。 -->
<link rel="apple-touch-icon" href="icon-180.png">
<script>
/* manifest 只在真的用 http(s) 打开时才挂上。
   🔴 双击本地文件（file://）时浏览器读 manifest 会按 CORS 拒掉，
   在控制台留两条红字 —— 这页有「双击就能开、0 报错」这条承诺，不能被一个装机用的
   附属文件破掉。装到主屏幕本来就要先在线打开，所以 file:// 下不挂它没有任何损失。
   （iOS 加主屏幕靠的是 apple-touch-icon 那三行，不依赖 manifest。）
   写在 head 里同步执行，跟静态标签一个时机，不影响安装条件的判定。 */
if (location.protocol !== 'file:') {
  var l = document.createElement('link');
  l.rel = 'manifest'; l.href = 'manifest.json';
  document.head.appendChild(l);
}
</script>
<meta name="apple-mobile-web-app-capable" content="yes">

<title>UED WorkBuddy</title>
<style>
:root{
  /* 全站一套 token —— 底座 / 资料库 / 问答 / 向导 / 终端 都用这一套，不再各层各定。
     2026-09-10 第二遍：按 apple.com 的结构走 —— 浅灰画布 #F5F5F7 上放白色圆角卡片，
     左栏 / 浮层 / 收起胶囊用磨砂半透明，遮罩带模糊，标题 56px 跟 14px 正文拉开反差。
     取值照 apple.com 实测：
       文字 #1D1D1F / #6E6E73 / #86868B · 底 #F5F5F7 / #E8E8ED · 分隔 #D2D2D7 · 主色 #0071E3
     三档描边留着（2026-09-08 走查「太淡」那次定的原则）：
       --ctl  #86868B  能点的：输入框 / 勾选框         3.5:1
       --line #D2D2D7  卡片描边 / 表头线
       --line-2 #E8E8ED 列表分割线 / 装饰线 */
  --canvas:#F5F5F7; --white:#fff;
  --sb-bg:rgba(255,255,255,.55); --soft:#F5F5F7; --soft-2:#E8E8ED;
  --glass:rgba(255,255,255,.78); --glass-line:rgba(0,0,0,.06);
  --blur:saturate(180%) blur(20px);
  --ink:#1D1D1F; --ink-2:#6E6E73; --ink-3:#86868B; --ink-4:#AEAEB2;
  --line:#D2D2D7; --line-2:#E8E8ED; --ctl:#86868B;
  --nav-on:#EAF3FF; --sel:#F5F5F7; --tab-on:#1D1D1F; --dark:#1D1D1F;
  --accent:#0071E3; --accent-hover:#0077ED; --accent-ink:#0066CC;
  --accent-fill:#EAF3FF; --accent-line:#A8CDF5; --accent-ring:rgba(0,113,227,.22);
  --ok:#34C759; --busy:#FF9F0A;
  /* 圆角四档：4 勾选框这类小件 · 8 控件 · 12 卡片/浮层 · 18 大容器（卡片/输入区/模态/终端卡）· 胶囊 */
  --r-xs:4px; --ctl-r:8px; --box-r:12px; --r-lg:18px; --r-pill:999px;
  --r:var(--box-r);
  /* 阴影：大而软，Apple 卡片那种「浮起一点」 */
  --sh-1:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.05);
  --sh-2:0 10px 30px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.05);
  --sh-3:0 30px 80px rgba(0,0,0,.20);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--canvas); -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.app{display:flex;height:100vh;overflow:hidden}

/* ── 左栏：磨砂半透明，右侧一条发丝线 ────────── */
.sb{width:256px;flex:0 0 256px;background:var(--sb-bg);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-right:1px solid var(--glass-line);
  display:flex;flex-direction:column;padding:24px 14px 16px}
.sb-head{display:flex;align-items:baseline;gap:7px;padding:4px 12px 28px}
.sb-head b{font-size:17px;font-weight:600;letter-spacing:-.4px}
.sb-head span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:var(--box-r);
  font-size:14px;color:var(--ink);text-align:left;transition:background .12s}
.nav button:hover{background:rgba(0,0,0,.04)}
.nav button.on{background:var(--nav-on);color:var(--accent-ink);font-weight:600}
.nav .fq{width:18px;height:18px;flex:0 0 18px;opacity:.75}
.nav button.on .fq{opacity:1;color:var(--accent)}
.nav .tail{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.nav button.on .tail{color:var(--accent-ink);opacity:.7}

/* 左栏底部那张更新卡：margin-top:auto 把它压到底 */
.sb-card{margin-top:auto;padding:16px;background:var(--white);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.sb-card .k{font-size:13px;font-weight:600;margin-bottom:4px}
.sb-card .d{font-size:12px;color:var(--ink-2);line-height:1.6}
.sb-card .b{margin-top:12px;display:inline-block;padding:6px 14px;background:var(--accent);color:#fff;
  border-radius:var(--r-pill);font-size:12px;font-weight:500}
.sb-card .b:hover{background:var(--accent-hover)}
.ava{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:600;flex:0 0 28px}

/* ── 第二栏（资料库专用）── */
.col2[hidden]{display:none}   /* 必须写 —— [hidden] 打不过下面的 display:flex */
.col2{width:244px;flex:0 0 244px;background:var(--sb-bg);border-right:1px solid var(--glass-line);
  display:flex;flex-direction:column;padding:26px 12px 12px}
.col2-h{padding:2px 10px 16px;font-size:22px;font-weight:600;letter-spacing:-.5px}
.c2search{display:flex;align-items:center;gap:7px;padding:8px 10px;margin:0 2px 12px;border-radius:var(--ctl-r);
  background:rgba(0,0,0,.05);font-size:12.5px;color:var(--ink-3)}
.c2search .fq{width:14px;height:14px}
.c2list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.c2item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:var(--ctl-r);text-align:left;font-size:13px}
.c2item:hover{background:rgba(0,0,0,.04)}
.c2item.on{background:var(--accent-fill);color:var(--accent-ink);font-weight:600}
.c2item .fq{width:15px;height:15px;flex:0 0 15px;opacity:.7}
.c2item.on .fq{opacity:1;color:var(--accent)}
.c2item .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2item .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.c2item.on .cnt{color:var(--accent-ink);opacity:.7}
.c2grp{padding:16px 10px 6px;font-size:12px;color:var(--ink-3)}

/* 内容区表格 */
.tbl{width:100%;border-collapse:collapse;margin-top:4px}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--ink-3);
  padding:0 12px 10px 0;border-bottom:1px solid var(--line);vertical-align:bottom}
.tbl td{padding:14px 12px 14px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
.tbl tbody tr:hover{background:var(--soft)}
.tbl td.nm{font-weight:500}
.tbl td.nm .f{display:flex;align-items:center;gap:9px}
.tbl td.nm .fq{width:16px;height:16px;color:var(--ink-2);flex:0 0 16px}
.tbl td.dim{color:var(--ink-2);font-size:12.5px}
/* 次要列折行不截断 —— 三栏页在 1024 下主区只剩 510px，四列怎么分都装不下一行。
   max-width:0 要留着，它是让上面的百分比列宽生效的开关。 */
.tbl td.dim{white-space:normal}
/* 状态列按内容宽度走：width:1% + nowrap = 收缩到刚好装下 */
.tbl th.st,.tbl td.st{width:1%;max-width:none;white-space:nowrap;padding-right:18px}
.libempty{margin-top:28px;padding:34px;text-align:center;background:var(--soft);border-radius:var(--r-lg);
  font-size:13px;color:var(--ink-2);line-height:1.85}

/* ── 主区：浅灰画布，顶上一层很淡的蓝色光晕当 KV ── */
main{flex:1;overflow-y:auto;position:relative;
  background:radial-gradient(56% 42% at 50% -8%,rgba(0,113,227,.14),rgba(0,113,227,0) 72%) no-repeat,var(--canvas)}
.wrap{max-width:824px;margin:0 auto;padding:96px 32px 64px}
/* 子页（资料库 / 技能）是一张白色大卡 */
.page{max-width:920px;margin:32px auto;padding:56px 56px 64px;background:var(--white);
  border-radius:var(--r-lg);box-shadow:var(--sh-1)}

h1{font-size:56px;line-height:1.07;font-weight:600;letter-spacing:-1.6px;text-align:center;color:var(--ink);text-wrap:balance}
.sub{text-align:center;font-size:17px;color:var(--ink-2);margin-top:14px}

/* 场景 tab：分段控件，灰轨 + 深色选中胶囊（apple.com 自己那个） */
.tabs{display:flex;justify-content:center;gap:2px;margin:44px auto 0;padding:4px;
  background:rgba(0,0,0,.06);border-radius:var(--r-pill);width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--r-pill);font-size:14px;
  color:var(--ink);white-space:nowrap;transition:.16s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--tab-on);color:#fff;font-weight:500}

.scene-note{text-align:center;font-size:17px;color:var(--ink-2);margin-top:26px;letter-spacing:-.2px}

/* 快捷卡（胶囊）：白色浮起，选中换主色浅底 */
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:24px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;background:var(--white);color:var(--ink);
  border:1px solid transparent;border-radius:var(--r-pill);font-size:14px;transition:.13s;box-shadow:var(--sh-1)}
.pill:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.pill.on{background:var(--accent-fill);border-color:var(--accent-line);color:var(--accent-ink);box-shadow:none;transform:none}
.pill .fq{width:15px;height:15px}
.pill .ar{font-size:12px;color:var(--ink-3);margin-left:1px}
.pill.on .ar{color:var(--accent-ink);opacity:.7}
.tile-h .ico .fq{width:17px;height:17px}
.cbar .fq,.cfoot .fq{width:16px;height:16px}
.mpop .fq{width:15px;height:15px}
/* 输入框里的场景标签 */
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:16px 20px 0}
.tagchip{display:inline-flex;align-items:center;gap:6px;padding:3px 7px 3px 9px;background:var(--accent-fill);
  color:var(--accent-ink);border-radius:var(--ctl-r);font-size:12.5px;font-weight:500}
.tagchip .fq{width:14px;height:14px}
/* 附件标签：× 在左侧，hover 出预览图 */
.filechip{position:relative;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 7px;
  background:var(--soft);border-radius:var(--ctl-r);font-size:12.5px;color:var(--ink);max-width:270px}
.filechip .x{display:grid;place-items:center;opacity:.55;border-radius:var(--r-xs);flex:0 0 14px}
.filechip .x:hover{opacity:1}
.filechip .x .fq{width:12px;height:12px}
.filechip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fprev{position:absolute;bottom:calc(100% + 9px);left:-2px;display:none;background:var(--white);
  border:1px solid var(--glass-line);border-radius:var(--box-r);padding:5px;box-shadow:var(--sh-2);z-index:40}
.filechip:hover .fprev{display:block}
.fprev img{display:block;max-width:320px;max-height:240px;border-radius:var(--ctl-r)}
.tagchip button{display:grid;place-items:center;opacity:.6;border-radius:var(--r-xs)}
.tagchip button:hover{opacity:1}
.tagchip button .fq{width:11px;height:11px}
/* 最佳实践案例：白色瓷片浮在画布上 */
.cases{margin-top:56px}
.cases-h{display:flex;align-items:center;margin-bottom:16px}
.cases-h b{font-size:17px;font-weight:600;letter-spacing:-.3px}
.cases-h button{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--accent-ink)}
.cases-h button:hover{text-decoration:underline}
.cases-h .fq{width:14px;height:14px}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.case{text-align:left;background:var(--white);border-radius:var(--r-lg);box-shadow:var(--sh-1);
  padding:18px 16px;transition:.18s;display:flex;flex-direction:column;gap:10px}
.case:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.case .ico{width:34px;height:34px;background:var(--accent-fill);border-radius:50%;display:grid;place-items:center;color:var(--accent-ink)}
.case .ico .fq{width:17px;height:17px}
.case .t{font-size:13.5px;font-weight:600;line-height:1.45;letter-spacing:-.1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  /* 标题固定一行 */
.case .g{font-size:12px;color:var(--ink-2);line-height:1.6}
.chip{font-size:12px;color:var(--ink-2);background:var(--soft-2);border-radius:var(--r-xs);padding:2.5px 6px}

/* 输入区：一张白卡浮在画布上，聚焦只换描边色（吉吉 2026-09-10：不要投影/光环） */
.cwrap{margin-top:32px}
.composer{background:var(--white);border:1px solid transparent;border-radius:var(--r-lg);
  box-shadow:var(--sh-1);transition:border-color .15s}   /* 不能 overflow:hidden — 会剪掉向上展开的模型浮层 */
.composer.focus{border-color:var(--accent)}
textarea{width:100%;border:none;outline:none;resize:none;padding:20px 22px 8px;
  font-family:inherit;font-size:16px;line-height:1.65;   /* 不能写 font:16px/1.65 inherit —— 简写不收 inherit，整条会被丢 */
  color:var(--ink);background:none;min-height:108px}
textarea::placeholder{color:var(--ink-3)}
.cbar{display:flex;align-items:center;gap:8px;padding:8px 14px 14px}
.plusw{position:relative}
.cbar .plus{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink-2)}
.cbar .plus.open{background:var(--soft-2);color:var(--ink)}
/* 浮层：磨砂半透明 + 发丝线 + 大软影 */
/* 🔴 菜单类浮层用实色白底，不做磨砂 —— 吉吉 2026-09-10 截图：二级菜单下面输入框的字透了上来。
   真因是嵌套：.ppop2 套在 .ppop 里，backdrop-filter 只会模糊父层的内容、不再模糊页面，
   半透明底就成了「露底」。磨砂只留给下面没有正文的地方（左栏 / 向导头尾 / 收起胶囊）。 */
.ppop{position:absolute;bottom:calc(100% + 10px);left:0;width:198px;background:var(--white);
  border:1px solid var(--glass-line);border-radius:var(--box-r);box-shadow:var(--sh-2);padding:6px;z-index:20}
.ppop .row{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:var(--ctl-r);
  font-size:13px;color:var(--ink);text-align:left}   /* 只作用于 .row —— 写成 .ppop button 会连二级菜单的 .p2row 一起压成 32px */
.ppop .row:hover{background:rgba(0,0,0,.05)}
.ppop .fq{width:16px;height:16px;color:var(--ink-2);flex:0 0 16px}
.ppop hr{border:none;border-top:1px solid var(--glass-line);margin:5px 0}
/* 一级项 + 右侧二级菜单 */
.pitem{position:relative}
.pitem>.row{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px;
  border-radius:var(--ctl-r);font-size:13px;color:var(--ink);text-align:left}
.pitem>.row .ar{margin-left:auto;color:var(--ink-3);display:grid;place-items:center}
.pitem>.row .ar .fq{width:13px;height:13px}
.pitem:hover>.row{background:rgba(0,0,0,.05)}
.ppop2{position:absolute;left:calc(100% + 6px);top:-6px;display:none;width:322px;background:var(--white);
  border:1px solid var(--glass-line);border-radius:var(--box-r);box-shadow:var(--sh-2);padding:6px;z-index:50}
.pitem:hover>.ppop2{display:block}
.p2search{display:flex;align-items:center;gap:8px;margin:2px 2px 6px;padding:8px 10px;border-radius:var(--ctl-r);
  background:rgba(0,0,0,.05);font-size:12.5px;color:var(--ink-3)}
.p2search .fq{width:14px;height:14px}
.p2list{max-height:296px;overflow-y:auto}
.p2row{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 8px;border-radius:var(--ctl-r);text-align:left}
.p2row:hover{background:rgba(0,0,0,.05)}
.p2row .av{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--accent-fill);
  color:var(--accent-ink);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.p2row .tx{min-width:0;display:flex;flex-direction:column;gap:2px}   /* span 是 inline，不设 flex 会叠在一起 */
.p2row .n{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p2row .d{font-size:12px;color:var(--ink-2);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .plus:hover{background:var(--soft-2)}
.cbar .sp{flex:1}
.model{position:relative}
.model>button svg{width:16px;height:16px}
.model>button{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:var(--r-pill);font-size:12.5px;color:var(--ink-2)}
.model>button:hover{background:var(--soft)}
.model.open>button{background:var(--soft);color:var(--ink)}
.mpop{position:absolute;bottom:calc(100% + 10px);right:0;width:360px;background:var(--white);
  border:1px solid var(--glass-line);border-radius:var(--box-r);box-shadow:var(--sh-2);padding:6px;z-index:20;
  max-height:436px;overflow-y:auto}
.mpop .max{display:flex;align-items:center;gap:9px;padding:10px 10px 11px}
.mpop .max .nm{font-size:14px;font-weight:600}
.sw{margin-left:auto;width:38px;height:22px;border-radius:var(--r-pill);background:var(--soft-2);position:relative;transition:.16s;flex:0 0 38px}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on i{left:18px}
.mhr{height:1px;background:var(--glass-line);margin:2px 0}
.mpop .row{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:var(--ctl-r);text-align:left}
.mpop .row:hover{background:rgba(0,0,0,.05)}
.mpop .row.on{background:rgba(0,0,0,.05)}
.mpop .row .nm{font-size:13.5px;display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.mpop .row .nm>span:first-child{white-space:nowrap}
.mpop .badge{font-size:12px;padding:1.5px 6px;border-radius:var(--r-xs);white-space:nowrap}
.mpop .badge.free{background:#FDECEC;color:#D0463F}
.mpop .badge.sub{background:#FBF1DE;color:#96702A}
.mpop .badge.rec{background:var(--accent-fill);color:var(--accent-ink)}
.mpop .rate{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mpop .tick{color:var(--accent);flex:0 0 15px;visibility:hidden;display:grid;place-items:center}
.mpop .row.on .tick{visibility:visible}
.mpop .mfoot{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:var(--ctl-r);width:100%;font-size:12.5px;color:var(--ink-2);text-align:left}
.mpop .mfoot:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.mic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.mic:hover{background:var(--soft);color:var(--ink)}
.mic .fq{width:17px;height:17px}
.send .fq,.send svg{width:15px;height:15px}
.send{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:0 0 36px;transition:background .12s}
.send:hover{background:var(--accent-hover)}
.send[disabled]{background:var(--soft-2);color:var(--ink-4);cursor:default}
.cfoot{display:flex;gap:6px;padding:12px 8px 0}
.cfoot button{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);padding:6px 10px;border-radius:var(--ctl-r)}
.cfoot button:hover{color:var(--ink);background:rgba(0,0,0,.05)}

/* 通用页面（在白色大卡里） */
.ph{margin-bottom:40px}
.ph h2{font-size:40px;font-weight:600;letter-spacing:-1px;line-height:1.1}
.ph p{font-size:17px;color:var(--ink-2);margin-top:12px;max-width:640px;line-height:1.6;letter-spacing:-.2px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--soft);border-radius:var(--r-lg);padding:18px;text-align:left}
.tile-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.tile-h .ico{width:30px;height:30px;flex:0 0 30px;background:var(--white);border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.tile-h b{font-size:14.5px;font-weight:600}
.tag{font-size:12px;padding:2px 9px;border-radius:var(--r-pill);background:var(--accent);color:#fff;margin-left:auto}
.tag.soon{background:var(--soft-2);color:var(--ink-2)}
.tile .cnt{font-size:12px;color:var(--ink);font-weight:500;margin-bottom:6px}
.tile .ds{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.grp{margin-bottom:36px}
.grp-t{font-size:12px;color:var(--ink-3);margin-bottom:10px;padding-left:2px;font-weight:500;text-transform:uppercase;letter-spacing:.2px}
.srow{display:flex;align-items:center;gap:10px;background:var(--soft);
  border-radius:var(--box-r);padding:14px 18px;margin-bottom:8px}
.srow .nm{font-size:14px;font-weight:500}
.srow .code{font-size:12px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.srow .ds{margin-left:auto;font-size:12.5px;color:var(--ink-2);text-align:right;max-width:44%}
.note{display:flex;gap:9px;align-items:flex-start;background:var(--soft);
  border-radius:var(--box-r);padding:12px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.75;margin-top:20px}
.note .fq{width:15px;height:15px;flex:0 0 15px;color:var(--ink-3);margin-top:3px}
.note b{color:var(--ink);font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;}
.back .fq{width:15px;height:15px}
.back{font-size:13px;color:var(--accent-ink);margin-bottom:18px}
.back:hover{text-decoration:underline}
@media (max-width:1080px){.cards,.grid3{grid-template-columns:repeat(2,1fr)}}
/* ==FQ-UI-CSS:BEGIN== */
/* ── 资料库真数据视图 ── */
.fqbar{display:flex;align-items:center;gap:10px;margin:0 0 16px}
/* 小号分段控件：跟首页场景 tab 同一个做法（灰轨 + 深色选中胶囊） */
.fqtabs{display:flex;gap:2px;background:var(--soft-2);padding:3px;border-radius:var(--r-pill)}
.fqtab{font:12px/1 inherit;color:var(--ink);background:none;border:0;padding:7px 13px;border-radius:var(--r-pill);cursor:pointer;white-space:nowrap}
.fqtab:hover{color:var(--ink)}
.fqtab.on{background:var(--tab-on);color:#fff;font-weight:500}
.fqsr{flex:1;min-width:120px;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--ctl-r);padding:0 11px;height:32px;background:var(--white)}
.fqsr:focus-within{border-color:var(--accent)}
.fqsr svg{color:var(--ink-3);flex:none}
.fqsr input{flex:1;border:0;outline:0;font:13px/1 inherit;color:var(--ink);background:none}
.fqsr input::placeholder{color:var(--ink-3)}
.fqcnt{font-size:12px;color:var(--ink-3);white-space:nowrap}

.fqsec{margin:0 0 28px}
.fqsec-h{font-size:13px;font-weight:600;color:var(--ink);margin:0 0 4px}
.fqsec-p{font-size:12px;color:var(--ink-2);line-height:1.7;margin:0 0 12px}

/* 图标网格：灰底瓷片，不描边 */
.icgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.iccell{border-radius:var(--ctl-r);padding:12px 6px 9px;text-align:center;cursor:pointer;background:var(--soft)}
.iccell:hover{background:var(--accent-fill)}
.iccell svg{width:20px;height:20px;color:var(--ink);display:block;margin:0 auto 8px}
.iccell span{display:block;font-size:12px;color:var(--ink-2);word-break:break-all;line-height:1.4}

/* 色块 */
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.swcell{border:1px solid var(--line-2);border-radius:var(--box-r);overflow:hidden;cursor:pointer;background:var(--white);
  display:flex;flex-direction:column;align-items:stretch;padding:0}   /* 卡片是 button：网格把同行卡片拉等高后 Chrome 默认把按钮内容垂直居中，色块会往下掉 10px 露白边（2026-09-09 吉吉截图，29 张里 5 张）。flex 纵向＝内容顶对齐 */
.swcell:hover{border-color:var(--accent-line)}
.swtop{height:52px}
.swbot{padding:9px 11px}
.swn{font-size:12px;color:var(--ink);line-height:1.5;word-break:break-all}
.swh{font-size:12px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}

/* 刻度 */
.scale{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.scitem{border-radius:var(--ctl-r);padding:10px 12px;min-width:66px;text-align:center;background:var(--soft)}
.scitem b{display:block;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.scitem i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:3px}
.scbar{background:var(--accent);border-radius:2px;height:8px;margin:0 auto 8px}
.fsrow{display:flex;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line-2)}
.fsrow b{font-size:12px;color:var(--ink-3);width:52px;flex:none;font-variant-numeric:tabular-nums}
.fsrow span{color:var(--ink)}

/* 阴影演示：这一格要留白底，阴影才看得出 */
.shgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.shcell{background:var(--white);border:1px solid var(--line-2);border-radius:var(--box-r);padding:16px}
.shcell b{display:block;font-size:13px;color:var(--ink);margin-bottom:6px}
.shcell p{font-size:12px;color:var(--ink-2);line-height:1.7;margin:0 0 10px}
.shcell code{display:block;font-size:12px;color:var(--ink-3);word-break:break-all;line-height:1.6;cursor:pointer}

/* 键值表 */
.kv{width:100%;border-collapse:collapse}
.kv td{border-bottom:1px solid var(--line-2);padding:11px 12px 11px 0;font-size:13px;color:var(--ink);vertical-align:top;line-height:1.7}
.kv td.k{width:31%;font-weight:600;padding-right:20px}
.kv td.v{color:var(--ink-2)}
.mono{font-size:12px;color:var(--ink-2);word-break:break-all;cursor:pointer}
.mono:hover{color:var(--accent-ink)}

/* 自查表 */
.ckgrp{border:1px solid var(--line-2);border-radius:var(--box-r);margin:0 0 10px;overflow:hidden}
.ckh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--white);border:0;padding:13px 15px;cursor:pointer;font:13px/1.5 inherit}
.ckh:hover{background:var(--soft)}
.ckh b{flex:1;font-weight:600;color:var(--ink)}
.ckh i{font-style:normal;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ckh svg{width:14px;height:14px;color:var(--ink-3);transition:transform .15s}
.ckh.open svg{transform:rotate(180deg)}
.ckbody{border-top:1px solid var(--line-2);padding:4px 15px 6px}
.ckrow{display:flex;gap:11px;padding:10px 15px;align-items:flex-start;border-radius:var(--ctl-r)}
.ckrow:hover{background:var(--soft)}
.ckbox{width:16px;height:16px;flex:none;margin-top:2px;border:1px solid var(--ctl);border-radius:var(--r-xs);background:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ckbox.on{background:var(--accent);border-color:var(--accent)}
.ckbox svg{width:11px;height:11px;color:#fff}
.cktx{flex:1;font-size:13px;color:var(--ink);line-height:1.75}
.cktx em{font-style:normal;display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.cktx.done{color:var(--ink-3);text-decoration:line-through}
.prog{display:flex;align-items:center;gap:11px;margin:0 0 16px}
.progbar{flex:1;height:6px;background:var(--soft-2);border-radius:var(--r-pill);overflow:hidden}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .2s}

/* 重点标记：只用字重，不引入新颜色 */
.hot{font-weight:600;color:var(--ink);margin-right:6px}
/* 🔴 内边距要挂在 .ckbody 上，不能挂在 table 上 ——
   这张表是 border-collapse:collapse，CSS 规范规定这种模式下
   表格自身的 padding 被忽略。计算样式里查得到、实际没生效，
   结果文档名比组标题少缩进 15px（量出来 580 vs 595）。 */
.ckbody .kv{padding:0}
.ckbody .kv td{font-size:12px}
/* 最后一行不要底边框 —— 它会和折叠组自己的底边框贴成两条线 */
.ckbody .kv tr:last-child td{border-bottom:0}

/* 知识库更新提示卡：点过就收起。
   🔴 必须显式写 [hidden]{display:none} —— [hidden] 打不过元素自己的 display，
   本项目在 .col2 上已经栽过一次。 */
.sb-card[hidden]{display:none!important}

/* 复制提示 */
#toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(14px);background:var(--dark);color:#fff;font-size:12px;padding:9px 16px;border-radius:var(--r-pill);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:99}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ==FQ-UI-CSS:END== */
/* ==WB-AI-CSS:BEGIN== */
/* ── 模型下拉一行放不下时退成省略号，别再压字（三段原本都 nowrap 且不许收缩）── */
.mpop .row .nm>span:first-child{overflow:hidden;text-overflow:ellipsis}
.mpop .row .rate{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* ── 跑任务：回答区 ── */
.runwrap{max-width:920px;margin:32px auto;padding:48px 56px 56px;background:var(--white);border-radius:var(--r-lg);box-shadow:var(--sh-1)}
.qbox{display:flex;gap:12px;align-items:flex-start;margin:0 0 22px}
/* 统一身份：内部工具没有登录态，用飞鹊的 person 图标当头像 */
.qava{width:26px;height:26px;flex:none;border-radius:999px;background:var(--accent);color:#fff;display:grid;place-items:center}
.qava svg{width:14px;height:14px;display:block}
.ava svg{width:15px;height:15px;display:block}
.qtx{flex:1;font-size:15px;color:var(--ink);line-height:1.75;white-space:pre-wrap;word-break:break-word;padding-top:2px}
.abox{border-top:1px solid var(--line-2);padding:22px 0 0}
.ahead{display:flex;align-items:center;gap:9px;margin:0 0 14px}
.ahead b{font-size:13px;color:var(--accent-ink)}
.ahead span{font-size:12px;color:var(--ink-3)}
.atx{font-size:15px;color:var(--ink);line-height:1.85;word-break:break-word}
.atx h3{font-size:15px;margin:22px 0 8px;color:var(--ink)}
.atx p{margin:0 0 12px}
.atx ul,.atx ol{margin:0 0 12px;padding-left:22px}
.atx li{margin:0 0 5px}
.atx table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:13px}
.atx th{background:var(--soft);color:var(--ink);font-weight:600;text-align:left;padding:10px 12px;font-size:12px;border-bottom:1px solid var(--line)}
.atx td{border-bottom:1px solid var(--line-2);padding:10px 12px;color:var(--ink);vertical-align:top;line-height:1.7}
.atx tr:first-child td:first-child,.atx td.c1{background:var(--soft)}
.atx code{background:var(--soft);padding:2px 6px;border-radius:var(--r-xs);font-size:13px}
.atx b{font-weight:600}
.atx .raw{white-space:pre-wrap;word-break:break-word}
.caret{display:inline-block;width:7px;height:15px;background:var(--accent);vertical-align:-2px;animation:cb 1s steps(2) infinite}
@keyframes cb{0%,50%{opacity:1}51%,100%{opacity:0}}
.srcs{margin:22px 0 0;padding:14px 0 0;border-top:1px solid var(--line-2)}
.srcs-h{font-size:12px;color:var(--ink-3);margin:0 0 9px}
.srcs-l{display:flex;flex-wrap:wrap;gap:6px}
.srcchip{font-size:12px;color:var(--ink-2);background:var(--soft);border:0;border-radius:var(--r-pill);padding:6px 12px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcchip:hover{background:var(--accent-fill);color:var(--accent-ink)}
.runfoot{margin:30px 0 0;display:flex;gap:9px;flex-wrap:wrap}
/* 按钮两级：次级＝灰底胶囊，主级＝主色胶囊 */
.rbtn{font:13px/1 inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:var(--r-pill);padding:11px 20px;cursor:pointer}
.rbtn:hover{background:var(--soft-2)}
.rbtn.pri{background:var(--accent);color:#fff}
.rbtn.pri:hover{background:var(--accent-hover);color:#fff}
/* 灰块（.nbox 底色就是 --soft）里的次级按钮改白底加描边 —— 跟块面同色时它就不像按钮了（吉吉 2026-09-10 截图） */
.nbox .rbtn:not(.pri){background:var(--white);border-color:var(--line)}
.nbox .rbtn:not(.pri):hover{background:var(--soft-2);border-color:var(--ctl)}

/* 接着问 */
.askmore{margin:26px 0 0;border:1px solid transparent;border-radius:var(--r-lg);background:var(--soft);padding:4px;transition:border-color .15s}
.askmore.focus{border-color:var(--accent)}
.askin{background:var(--white);border-radius:var(--box-r);padding:12px 14px;display:flex;align-items:flex-end;gap:10px}
.askin textarea{flex:1;border:0;outline:0;resize:none;font:14px/1.65 inherit;color:var(--ink);background:none;min-height:24px;max-height:180px}
.askin textarea::placeholder{color:var(--ink-3)}
.asksend{flex:none;width:30px;height:30px;border-radius:999px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;cursor:pointer}
.asksend:hover{background:var(--accent-hover)}
.asksend:disabled{background:var(--soft-2);color:var(--ink-4);cursor:default}
.asksend svg{width:14px;height:14px}
.asksend svg path{fill:currentColor}
.askhint{font-size:12px;color:var(--ink-3);padding:7px 14px 3px}
.turn{border-top:1px solid var(--line-2);padding:22px 0 0;margin:22px 0 0}

/* 提示条 / 报错 */
.nbox{border:0;border-radius:var(--box-r);padding:18px 20px;margin:0 0 20px;background:var(--soft)}
.nbox b{display:block;font-size:13px;color:var(--ink);margin:0 0 6px}
.nbox p{font-size:13px;color:var(--ink-2);line-height:1.8;margin:0 0 10px}
.nbox p:last-child{margin:0}
.nbox.warn{background:#FFF7E6}
.nbox ol{margin:6px 0 10px;padding-left:20px;font-size:13px;color:var(--ink-2);line-height:1.9}

/* 设置弹层 */
#wbmask{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:80;display:grid;place-items:center;padding:24px}
.wbdlg{background:var(--white);border-radius:var(--r-lg);width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:30px 32px;box-shadow:var(--sh-3)}
.wbdlg h3{font-size:22px;color:var(--ink);margin:0 0 8px;letter-spacing:-.5px}
.wbdlg .sub{font-size:13px;color:var(--ink-2);line-height:1.8;margin:0 0 20px}
.fld{margin:0 0 16px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:0 0 7px}
.fld .hint{font-size:12px;color:var(--ink-3);line-height:1.7;margin:6px 0 0}
.fld input,.fld select{width:100%;box-sizing:border-box;font:13px/1 inherit;color:var(--ink);border:1px solid var(--ctl);border-radius:var(--ctl-r);padding:0 12px;height:40px;background:var(--white);outline:0;transition:border-color .12s,box-shadow .12s}
.fld input:focus,.fld select:focus{border-color:var(--accent)}
.dfoot{display:flex;gap:9px;justify-content:flex-end;margin:22px 0 0;align-items:center}
.dfoot .msg{flex:1;font-size:12px;color:var(--ink-2);line-height:1.6}
.prov{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.provb{text-align:left;background:var(--soft);border:1px solid transparent;border-radius:var(--box-r);padding:11px 13px;cursor:pointer}
.provb:hover{background:var(--soft-2)}
.provb.on{border-color:var(--accent-line);background:var(--accent-fill)}
.provb b{display:block;font-size:13px;color:var(--ink);font-weight:600;margin:0 0 3px}
.provb span{display:block;font-size:12px;color:var(--ink-3);line-height:1.5}
/* ==WB-AI-CSS:END== */
/* ==WB-M-CSS:BEGIN== */
/* ══════════ 移动端布局层 ══════════ */

/* 顶栏和遮罩由 JS 一次性插入，桌面宽度下用 CSS 藏起来 ——
   这样转屏 / 改窗口宽度不需要重跑 JS，纯 CSS 切换。 */
.wbm-top,.wbm-scrim{display:none}

@media (max-width:768px){

/* ── 文档改成整页滚动 ──
   桌面版是 .app 撑满 100vh、main 自己滚。手机上这么做有两个问题：
   iOS 的 100vh 包含了会收起的地址栏（内容被截掉一截），
   而且内部滚动容器在 iOS 上不跟地址栏联动，滚起来别扭。
   所以手机上让文档本体滚。 */
html,body{height:auto;min-height:100%}
html{scroll-padding-top:64px}          /* 锚点/聚焦滚动时别被固定顶栏盖住 */
.app{display:block;height:auto;overflow:visible}
main{overflow:visible;min-height:calc(100vh - 52px)}
body{-webkit-tap-highlight-color:rgba(59,158,255,.14)}

/* ── 固定顶栏 ── */
.wbm-top{display:flex;position:fixed;top:0;left:0;right:0;z-index:60;
  height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0 6px;
  align-items:center;gap:4px;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line-2)}
.wbm-top .wbm-ic{width:40px;height:40px;flex:0 0 40px;border-radius:var(--ctl-r);
  display:grid;place-items:center;color:var(--ink)}
.wbm-top .wbm-ic:active{background:var(--sel)}
.wbm-top .wbm-ic .fq{width:19px;height:19px}
.wbm-top .wbm-t{flex:1;min-width:0;font-size:15px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}

/* ── 左栏改成抽屉 ──
   用的是桌面版那个 .sb 本体，不是复制一份，所以左栏里加了什么手机上自动有。 */
.sb{position:fixed;top:0;bottom:0;left:0;z-index:80;
  width:82vw;max-width:304px;
  padding:calc(14px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  transform:translateX(-101%);transition:transform .24s ease;
  box-shadow:2px 0 24px rgba(0,0,0,.14)}
body.wbm-open .sb{transform:none}
.wbm-scrim{display:block;position:fixed;inset:0;z-index:75;background:rgba(0,0,0,.42);
  opacity:0;pointer-events:none;transition:opacity .22s}
body.wbm-open .wbm-scrim{opacity:1;pointer-events:auto}
/* 抽屉开着时锁住背景滚动。三层一起写是因为 iOS Safari 上只写 body 的 overflow
   历史上一直不可靠（背景照样能跟着手指滚）：
     · html 也加一层（:has 从 iOS 15.4 起支持）
     · 遮罩自己 touch-action:none，手指落在遮罩上不产生滚动
     · 抽屉内部 overscroll-behavior:contain，滚到底不把外层带着走
   🔴 这一条是照 iOS 已知行为写的，我手上只有桌面 Chrome 模拟器，**没在真机确认过**。 */
body.wbm-open{overflow:hidden}
html:has(body.wbm-open){overflow:hidden}
.wbm-scrim{touch-action:none}
.sb{overscroll-behavior:contain}
.nav button{padding:11px 12px}                      /* 点击区从 36 提到 42 */

/* 第二栏（资料库中间那栏）在手机上不出现 ——
   它和主区的「全部资料」列表是同一批库，手机上留一份就够，
   靠主区列表点进去、靠顶栏返回退出来。 */
.col2{display:none!important}

/* ── 版面 ── */
.wrap{max-width:none;padding:calc(52px + env(safe-area-inset-top) + 18px) 16px 44px}
.page{max-width:none;margin:0;padding:calc(52px + env(safe-area-inset-top) + 18px) 16px 44px;border-radius:0;box-shadow:none}
.runwrap{max-width:none;margin:0;padding:calc(52px + env(safe-area-inset-top) + 18px) 16px 46px;border-radius:0;box-shadow:none}

/* 320px 上标题会折成两行，中文默认可以在任意字之间断，
   折出来是「…我帮 / 你」，第二行只剩一个字。balance 让两行长度接近，
   断在标点后面。不支持的浏览器退回普通折行，不会更差。 */
h1{font-size:30px;line-height:1.2;letter-spacing:-.8px;text-wrap:balance}
.sub{font-size:13.5px;margin-top:9px}
.ph h2{font-size:26px}
.ph p{font-size:14.5px;max-width:none}
.ph{margin-bottom:20px}

/* 场景 tab 一行横滑 ——
   6 个 tab 靠 flex-wrap 会折成两三行，外面那个 999px 的灰底包不住多行。 */
.tabs{margin-top:24px;justify-content:flex-start;flex-wrap:nowrap;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;scroll-snap-type:x proximity;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;scroll-snap-align:center;padding:9px 14px}
.scene-note{margin-top:14px;font-size:14px;text-align:left}
.pills{justify-content:flex-start;margin-top:16px}
.pill{padding:10px 14px}

/* ── 输入区 ──
   ⚠️ 手机上输入类控件字号必须 ≥16px，否则 iOS Safari 一聚焦就整页放大，
   而且退出聚焦不会自动缩回去 —— 这是移动端最容易漏的一条。 */
.cwrap{margin-top:18px}
textarea{font-size:16px;min-height:88px;padding:14px 15px 6px}
.cbar{gap:6px;padding:6px 9px 10px}
.cbar .plus,.mic{width:34px;height:34px}        /* 桌面 30px，手机上偏小 */
.send{width:36px;height:36px;flex:0 0 36px}
.cfoot{flex-wrap:wrap;padding:8px 8px 4px}
.cfoot button{max-width:100%}
.cfoot button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.model>button{padding:7px 9px;max-width:44vw}
.model>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{padding:12px 14px 0}
.tagchip button,.filechip .x{padding:5px;margin:-5px}   /* 图标 11-12px，点击区补到 22 以上 */
.askin textarea{font-size:16px}
.fqsr input{font-size:16px}
.fld input,.fld select{font-size:16px;height:44px}

/* ── 浮层改成底部抽屉 ──
   桌面版这两个浮层是 198px / 360px 宽、贴着按钮向上弹；
   手机屏只有 375 左右，贴着弹会顶出屏幕右侧。 */
.ppop,.mpop{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0;border:0;border-top:1px solid var(--line-2);
  padding:8px 8px calc(10px + env(safe-area-inset-bottom));
  max-height:76vh;overflow-y:auto;z-index:90;
  box-shadow:0 -8px 40px rgba(0,0,0,.18)}
.ppop .row,.mpop .row,.mpop .mfoot{height:44px}
/* 抽屉后面压暗一层：用伪元素而不是新插一个遮罩节点，因为「点空白关闭」
   靠的是页面上原有那个 document click 判 closest('.plusw') / closest('.model')，
   真插一个节点会挡住那次点击。pointer-events:none 让点击穿过去。 */
.ppop::before,.mpop::before{content:'';position:fixed;inset:0;z-index:-1;
  background:rgba(0,0,0,.3);pointer-events:none}
.mpop .max{padding:12px 10px 13px}
.mpop .row .nm{font-size:14px}
/* ≤360px（初代 iPhone SE / 小安卓）：一行放不下「名字 + 标签 + 说明」三段，去掉次要的说明，名字和标签留全。
   2026-09-09 才看见：320px 上「免费」标签一直压在说明字上，只是溢出不裁、肉眼当成挤了一点。 */
@media (max-width:360px){ .mpop .row .rate{display:none} }

/* 二级菜单：桌面靠 :hover 从右侧弹出。手机没有 hover，
   而且右侧没地方弹 —— 改成点一级项在原地展开，向下推。 */
.pitem>.row{height:44px}
.pitem:hover>.row{background:none}
.pitem:hover>.ppop2{display:none}
.pitem.wbm-on>.row{background:var(--soft)}
.pitem.wbm-on>.row .ar{transform:rotate(90deg)}
.pitem>.row .ar{transition:transform .16s}
.ppop2{position:static;display:none;width:auto;padding:2px 0 8px 12px;
  margin:0 0 2px 14px;border:0;border-left:2px solid var(--line);
  border-radius:0;box-shadow:none;background:none}
.pitem.wbm-on>.ppop2{display:block}
.p2list{max-height:none}
.p2row{padding:9px 8px}

/* 附件图片预览：桌面是 hover 出小卡，手机改成点一下居中看大图 */
.filechip:hover .fprev{display:none}
.filechip.wbm-on .fprev{display:block;position:fixed;left:14px;right:14px;bottom:auto;
  top:50%;transform:translateY(-50%);z-index:95;text-align:center}
.filechip.wbm-on .fprev img{max-width:100%;max-height:60vh;margin:0 auto}

/* ── 宽表格改成卡片 ──
   四五列的表在 375px 宽里必然被 ellipsis 截掉，而组件 key、图标名这些
   恰恰是要整段看清、要长按复制的内容。thead 收起，每行摊成一张卡。
   列名由 JS 从 thead 抄进 data-label，不在这里写死。

   🔴 标签走「上下叠」不走「左右并排」，两个实测原因：
   ① td 一旦 display:flex，单元格里原有的 <b>、<span> 就变成了 flex 子项，
      会被并排挤成一列一列的 —— 飞鹊组件库那张表的「注意」两个字被压成了竖排。
   ② 列名长度差别很大（「状态」2 字 vs「组件名（Figma 里的真名）」14 字），
      固定宽的标签列要么把长列名折成 3 行，要么把短列名的空白浪费掉。
   上下叠对两者都免疫，代价是卡片高一些。 */
.tbl thead,.atx thead{display:none}
.tbl tbody tr,.atx tbody tr{display:block;background:var(--white);
  border:1px solid var(--line-2);border-radius:var(--box-r);padding:11px 13px;margin:0 0 8px}
.tbl tbody tr:hover,.atx tbody tr:hover{background:var(--white)}
.tbl td,.atx td{display:block;padding:5px 0;border:0;max-width:none;
  white-space:normal;overflow:visible;text-overflow:clip;
  overflow-wrap:anywhere;font-size:13px;line-height:1.7}
.tbl td::before,.atx td::before{content:attr(data-label);display:block;
  font-size:12px;color:var(--ink-3);line-height:1.5;margin:0 0 1px}
.tbl td[data-label=""]::before,.atx td[data-label=""]::before{display:none}
.tbl td.wbm-empty,.atx td.wbm-empty{display:none}
/* 桌面上「状态」列是 width:1% + nowrap 收缩到内容宽，那条规则到了卡片模式会失效成
   「父容器宽度的 1%」—— 实测「已就绪」被压到 18px。卡片里每格独占一行，不需要收缩。 */
.tbl td.st{width:auto;max-width:none;white-space:normal;padding-right:0}
/* 第一列当卡片标题：它就是这一行的身份，头上再顶一个「名称」是噪音 */
.tbl tbody td:first-child,.atx tbody td:first-child{font-size:14.5px;font-weight:600;
  padding:1px 0 7px}
.tbl tbody td:first-child::before,.atx tbody td:first-child::before{display:none}
.atx table{display:block}
.atx td.c1,.atx tr:first-child td:first-child{background:none}

/* 键值表本来就是两列，不用摊 —— 上下叠起来就行 */
.kv td{display:block;padding:8px 0}
.kv td.k{width:auto;padding-right:0;padding-bottom:2px}
.kv tr{display:block;border-bottom:1px solid var(--line-2);padding:3px 0}
.kv td{border:0}

/* ── 网格全部收成一列（或按内容放宽） ── */
.cgrid,.grid2,.grid3,.shgrid,.prov{grid-template-columns:1fr}
/* 案例卡在手机上横过来（图标 | 标题＋说明），竖着排 5 张要滑太久。
   用 grid 而不是 flex-direction:row —— 卡里是「图标 / 标题 / 说明」三个平级子元素，
   flex 会把三个并排成一行，标题和说明挤在一起。 */
.case{display:grid;grid-template-columns:30px 1fr;column-gap:11px;row-gap:3px;
  align-items:start;padding:12px}
.case .ico{grid-row:1 / span 2}
.case .t{grid-column:2;white-space:normal}   /* 手机上一行放不下，允许折行 */
.case .g{grid-column:2}
.icgrid{grid-template-columns:repeat(auto-fill,minmax(74px,1fr))}
.swgrid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.cases{margin-top:32px}

/* 技能行 / 项目行：右对齐的说明列在窄屏挤成一条，改成上下叠 */
.srow{flex-direction:column;align-items:flex-start;gap:5px}
.srow .ds{margin-left:0;max-width:none;text-align:left}
.srow .code{overflow-wrap:anywhere}

/* 资料库工具条：搜索框占满一行，tab 横滑 */
.fqbar{flex-wrap:wrap;gap:8px}
.fqtabs{order:2;overflow-x:auto;scrollbar-width:none;max-width:100%}
.fqtabs::-webkit-scrollbar{display:none}
.fqtab{flex:0 0 auto}
.fqsr{order:1;flex:1 0 100%;height:40px}
.fqcnt{order:3;margin-left:auto}
.mono,.shcell code{overflow-wrap:anywhere}
/* 点一下复制的那些值（组件 key、样式 ID、阴影 CSS）在桌面上靠 title 提示，
   而 title 在触屏上永远不出现 —— 组件 key 还是截断显示的，
   不给可点的信号，手机上就是一串看不完又不知道能干什么的字符。
   用虚线下划线 + 链接色表示「这个能点」，不额外加文案。 */
.mono,.shcell code{color:var(--accent-ink);
  text-decoration:underline dotted;text-underline-offset:3px}
.fsrow{flex-wrap:wrap;gap:4px 14px}

/* 自查表：勾选框点击区放大 */
.ckrow{padding:11px 12px}
.ckbox{width:20px;height:20px;margin-top:0}
.ckbox svg{width:13px;height:13px}
.ckh{padding:14px 13px}
.ckbody{padding:2px 10px 4px}

/* 回答区 */
.qtx,.atx{font-size:15px}
.runfoot .rbtn{padding:11px 16px}
/* 参考资料的文件名本身就是要看的信息，窄屏上不截断、改折行。
   桌面版是 nowrap + 省略号（一行摆得下），320px 上会截成
   「project-feique-library-pag…」，看不出是哪份。 */
.srcchip{padding:8px 13px;white-space:normal;overflow:visible;text-overflow:clip;
  text-align:left;overflow-wrap:anywhere;border-radius:var(--box-r);line-height:1.55}

/* 设置弹层 */
#wbmask{padding:12px}
.wbdlg{padding:20px 18px;max-height:92vh;border-radius:var(--r-lg)}
.dfoot{flex-wrap:wrap;justify-content:stretch}
.dfoot .msg{flex:1 0 100%;order:3;margin-top:4px}
.dfoot .rbtn{flex:1}

#toast{bottom:calc(26px + env(safe-area-inset-bottom))}

/* 从主屏幕启动、或者横屏时，内容会一直铺到刘海和圆角下面 ——
   开了 viewport-fit=cover 之后浏览器不再自动内缩，左右两边得自己让出来。
   用 max() 而不是直接加，保证竖屏（安全区为 0）时还是原来的 16px。 */
.wrap,.page,.runwrap{padding-left:max(16px,env(safe-area-inset-left));
  padding-right:max(16px,env(safe-area-inset-right))}
.wbm-top{padding-left:max(6px,env(safe-area-inset-left));
  padding-right:max(6px,env(safe-area-inset-right))}
.sb{padding-left:max(12px,env(safe-area-inset-left))}
.ppop,.mpop{padding-left:max(8px,env(safe-area-inset-left));
  padding-right:max(8px,env(safe-area-inset-right))}
#wbmask{padding-left:max(12px,env(safe-area-inset-left));
  padding-right:max(12px,env(safe-area-inset-right))}

/* 返回上一层（资料库详情页用，JS 插入） */
.wbm-back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);
  margin:0 0 14px;padding:6px 0}
.wbm-back .fq{width:15px;height:15px}
}

/* 桌面版面的最小节点就是 1024，再窄不做变化（吉吉 2026-09-07 定）。
   「不做变化」用 min-width 落地：窗口窄过 1024 时版面原样保持、外面出横向滚动条，
   而不是让三栏继续压缩 —— 继续压缩本身就是一种变化，而且 769~1023 这一段
   没人为它画过稿，压出来的样子是没设计过的。
   768 及以下由上面那个 media 接管，直接换成移动端，不经过这个中间态。 */
@media (min-width:769px){
  body{min-width:1024px}

  /* 首页内容在视口里垂直居中（吉吉 2026-09-07：「现在有点向上移了」）。
     原来是固定 padding-top:96px 顶在上面，内容不满一屏时下面空一大片，整体偏高。
     🔴 用 margin:auto 而不是 justify-content:center —— 后者在内容比视口高的时候
     会把溢出的顶部裁掉、而且滚不上去（flex 居中的经典坑）。margin:auto 在没有
     富余空间时自动归零，退回普通的从上往下排。
     只作用于首页 .wrap：资料库、技能这些是长列表，从顶部排才对；
     回答页 .runwrap 是对话流，也必须顶部对齐。 */
  main{display:flex;flex-direction:column}
  /* 🔴 上面这行是为了让 .wrap 的 margin:auto 能做垂直居中，但它有个副作用：
     flex 容器里的元素只要带了 auto 的横向 margin，align-self:stretch 就失效，
     宽度从「撑满容器」变成「按内容收缩」。资料库那张表因此被压到 622px（本该 920），
     「已就绪」标签和「收录」列都被省略号截掉。
     显式写回 width:100% —— 配合各自的 max-width，宽度回到原来的行为，
     横向和纵向的 auto margin 都还在。 */
  main>.page,main>.runwrap,main>.wrap{width:100%}
  /* 上移 30px：视觉重心比几何中心高一点才不显得坠（吉吉 2026-09-07「视觉点有点靠下」）。
     做法是底部多留 60 —— margin:auto 把剩余空间上下均分，元素高 60，
     上下就各少分 30，内容整体正好上移 30px。
     🔴 不用 transform:translateY(-30px)：那个不参与布局，内容比视口高的时候
     会把顶部推到可视区外面、还滚不回去。 */
  .wrap{margin:auto;padding:40px 32px 100px}
}
/* ==WB-M-CSS:END== */
/* ==WB-TERM-CSS:BEGIN== */

/* ═══ 接力到终端 · 用全站那一套 token（:root 上定义，这一层不再自己定色）═══
   吉吉 2026-09-09：「内嵌式终端我希望不是完全分成两个区域，而是包在 UW 的风格里面」。
   上一版是一根黑色半屏柱子直接贴到视口右边，跟左边的白页面是两个世界。
   现在终端是页面里的一张圆角卡片：浅色卡头（标题 / 状态 / 按钮都是页面的样式），
   卡片里再嵌一块深色终端区。分区机制不变（.uwt-split 收窄 .app），变的是外观。 */

/* ── 选择界面 ─────────────────────────────────── */
.uwt-mask{position:fixed;inset:0;z-index:240;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:28px}
.uwt-mask.uwt-on{display:flex}
.uwt-box{width:min(560px,100%);background:var(--white);border-radius:var(--r-lg);
  box-shadow:var(--sh-3);overflow:hidden;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;color:var(--ink)}
.uwt-hd{padding:22px 24px 4px}
.uwt-hd h3{margin:0;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.5px}
.uwt-hd p{margin:6px 0 0;font-size:13px;color:var(--ink-2)}
.uwt-opts{padding:14px 24px 4px;display:flex;flex-direction:column;gap:8px}
.uwt-opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 14px;border:1px solid var(--line);border-radius:var(--box-r);
  background:var(--white);cursor:pointer;font:inherit;color:inherit;transition:border-color .12s,background .12s}
.uwt-opt:hover:not(:disabled){border-color:var(--accent-line);background:var(--accent-fill)}
.uwt-opt:disabled{cursor:not-allowed;border-color:transparent;background:var(--soft)}
.uwt-opt:disabled .uwt-on1,.uwt-opt:disabled .uwt-on2{color:var(--ink-3)}
.uwt-oi{flex:0 0 auto;width:18px;height:18px;margin-top:2px;color:var(--ink-2)}
.uwt-opt:disabled .uwt-oi{color:var(--ink-4)}
.uwt-ot{flex:1 1 auto;min-width:0}
.uwt-on1{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink)}
.uwt-on2{margin:3px 0 0;font-size:13px;color:var(--ink-2)}
.uwt-on3{margin:3px 0 0;font-size:12px;color:var(--ink-3)}
.uwt-rec{flex:0 0 auto;font-size:11px;font-weight:500;padding:1px 8px;border-radius:var(--r-pill);
  background:var(--accent-fill);color:var(--accent-ink)}
.uwt-ft{display:flex;align-items:center;gap:8px;padding:14px 24px 22px}
.uwt-note{flex:1 1 auto;min-width:0;font-size:12px;color:var(--ink-3)}
.uwt-btn{flex:0 0 auto;white-space:nowrap;padding:8px 16px;border:0;border-radius:var(--r-pill);background:var(--soft);
  cursor:pointer;font:13px/1.4 inherit;color:var(--ink)}
.uwt-btn:hover{background:var(--soft-2)}
.uwt-btn.uwt-pri{background:var(--accent);color:#fff}
.uwt-btn.uwt-pri:hover{background:var(--accent-hover)}

/* ── 终端那一栏 ───────────────────────────────────
   真分区：开终端 → <html> 挂 .uwt-split → 主容器 .app 和向导弹层一起收窄，两边都完整可见。
   宽度用 --uwt-w 一个变量驱动，分隔条拖它，卡片和被收窄的两边同时跟着变。
   这一栏自己是页面的白底，卡片留 12px 边距 —— 所以看起来是「页面里放了一张卡」。 */
:root{--uwt-w:min(46vw,860px)}
.uwt-drawer{position:fixed;top:0;right:0;bottom:0;z-index:250;
  width:var(--uwt-w);padding:12px 12px 12px 6px;
  background:var(--canvas);
  display:none;flex-direction:column;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;color:var(--ink)}
.uwt-drawer.uwt-on{display:flex}
.uwt-panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:var(--white);border:1px solid var(--line-2);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);overflow:hidden}

/* 分区：主内容和两个弹层都让出右边那一栏。
   .uwt-mask（选三条路那个弹层）也要列 —— 它 inset:0 在整个视口里居中，不列就压在终端底下。 */
html.uwt-split .app{width:calc(100% - var(--uwt-w))}
html.uwt-split .wizmask{right:var(--uwt-w)}
html.uwt-split .uwt-mask{right:var(--uwt-w)}
html.uwt-split .wz-peek{max-width:calc(100vw - var(--uwt-w) - 40px)}

/* 分隔条：卡片左边那 12px 空隙就是抓取区，中间一枚常驻的小握把（看得见才知道能拖）。 */
.uwt-grip{position:absolute;left:-6px;top:0;bottom:0;width:12px;cursor:col-resize;z-index:3;
  display:flex;align-items:center;justify-content:center}
.uwt-grip::before{content:"";width:4px;height:44px;border-radius:var(--r-pill);
  background:var(--ink-4);transition:background .12s}
.uwt-grip:hover::before,.uwt-grip.uwt-drag::before{background:var(--ink-3)}
html.uwt-dragging{cursor:col-resize;user-select:none}

/* 收起之后回去的入口：右下角一枚白色胶囊（会话在桥上还活着 30 分钟，没入口就等于活丢了）。
   只在真有活着的会话时出现。 */
.uwt-reopen{position:fixed;right:20px;bottom:20px;z-index:230;
  display:none;align-items:center;gap:8px;padding:9px 14px 9px 12px;
  border:1px solid var(--glass-line);border-radius:var(--r-pill);
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:var(--ink);cursor:pointer;
  font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
  box-shadow:var(--sh-2)}
.uwt-reopen.uwt-on{display:flex}
.uwt-reopen:hover{background:rgba(255,255,255,.95)}
.uwt-reopen .uwt-rdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
.uwt-reopen .uwt-rdot.uwt-run{background:var(--busy);animation:uwt-pulse 1.1s ease-in-out infinite}
.uwt-reopen b{font-weight:500;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uwt-reopen .uwt-rgo{color:var(--accent-ink);font-size:12px;flex:0 0 auto}

/* 🔴 向导开着的时候它要让开：向导右下角就是「下一步」，胶囊落在 20px 处正好盖住它
   （2026-09-09 截图撞上）。压到遮罩底下也不行 —— 从向导起的终端、收起后就再点不到它。
   所以向导开着时抬高到页脚之上（z 230 > 向导 200，< 选三条路那个弹层 240）。 */
body:has(.wizmask.wzon) .uwt-reopen{bottom:92px}

/* 卡头：跟页面同一套字号与色 */
.uwt-dhd{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:12px 14px 12px 16px;border-bottom:1px solid var(--line-2);background:var(--white)}
.uwt-dot{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.uwt-dot.uwt-run{background:var(--busy);animation:uwt-pulse 1.1s ease-in-out infinite}
.uwt-dot.uwt-dead{background:var(--ink-4)}
@keyframes uwt-pulse{0%,100%{opacity:1}50%{opacity:.35}}
.uwt-dtt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px}
.uwt-dt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:600;color:var(--ink)}
.uwt-dsub{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uwt-dbtn{flex:0 0 auto;padding:5px 12px;border:0;border-radius:var(--r-pill);
  background:var(--soft);color:var(--ink);cursor:pointer;font:12px/1.4 inherit}
.uwt-dbtn:hover{background:var(--soft-2)}
/* 终端区：深色块嵌在白卡里，四边留 12px */
.uwt-dbody{flex:1 1 auto;min-height:0;position:relative;margin:12px 12px 10px;
  border-radius:var(--box-r);background:#1D1D1F;overflow:hidden}
.uwt-xt{position:absolute;inset:10px 6px 10px 12px}
.uwt-dtip{flex:0 0 auto;padding:0 16px 12px;color:var(--ink-3);font-size:12px;display:flex;align-items:center;gap:10px}
.uwt-dtip b{color:var(--ink-2);font-weight:500}
.uwt-boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#A1A1A6;font-size:13px;text-align:center;padding:24px;line-height:1.8}
/* 🔴 必须显式写。`[hidden]` 的 display:none 是浏览器默认样式表里的，
   优先级低于上面这条 class 里的 display:flex —— 不写的话 el.hidden=true 之后
   「正在起终端…」照样铺在终端上。 */
.uwt-boot[hidden]{display:none}

/* 🔴 视口不够宽就别硬分区：1100px 以下分完两边都不够用，
   终端占满、主内容照旧留在底下。判据是「分完之后左边还够不够干活」，不是屏幕类别。 */
@media (max-width:1100px){
  .uwt-drawer{width:100vw;padding:8px}
  html.uwt-split .app{width:100%}
  html.uwt-split .wizmask{right:0}
  html.uwt-split .uwt-mask{right:0}
  .uwt-grip{display:none}
}
@media (max-width:760px){
  .uwt-box{width:100%}
  .uwt-dsub{display:none}
  .uwt-reopen{right:12px;bottom:calc(12px + env(safe-area-inset-bottom))}
}

/* ==WB-TERM-CSS:END== */
/* ==WB-WIZ-CSS:BEGIN== */

/* ═══ 向导层：用全站那一套 token（:root），只写结构 ═══
   2026-09-10 吉吉：「流程卡片的 UI 样式整体重新设计下，结构参考 CE，UI 按 Apple」。
   结构上借了 CE 两条：① 左侧一根步骤栏，每一步下面挂这一步已定的答案（每步交一份耐久产物）
   ② 右侧任务单把「这一单会交出什么」放最前（入口先看清产物契约），确定 / 待定跟在后面。
   视觉：浅灰画布上三栏 —— 白色步骤栏 / 灰底＋白色问题卡 / 白色任务单；头尾磨砂。 */
.wizmask{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:none;align-items:center;justify-content:center;padding:28px}
.wizmask.wzon{display:flex}
.wiz{width:min(1240px,100%);height:min(880px,calc(100vh - 56px));background:var(--canvas);
  border-radius:var(--r-lg);box-shadow:var(--sh-3);
  display:flex;flex-direction:column;overflow:hidden}

/* ── 头 ── */
.wz-hd{display:flex;align-items:center;gap:12px;padding:18px 24px;flex:0 0 auto;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glass-line)}
.wz-tag{font-size:12px;color:var(--accent-ink);background:var(--accent-fill);
  border-radius:var(--r-pill);padding:3px 10px;flex:0 0 auto;font-weight:500}
.wz-t{font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.3px}
.wz-x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;color:var(--ink-3);
  cursor:pointer;padding:0 4px;border-radius:var(--ctl-r)}
/* 关闭键悬停只提亮不加底（吉吉 2026-09-08） */
.wz-x:hover{color:var(--ink)}

.wz-body{flex:1;display:flex;min-height:0}

/* ── 左：步骤栏 ── */
.wz-rail{width:236px;flex:0 0 auto;padding:18px 12px;overflow:auto;background:var(--white);
  border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:2px}
.wz-rail .wzs{position:relative;display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:12px;border:0;border-radius:var(--box-r);background:var(--white);cursor:pointer;
  font-size:14px;color:var(--ink-3);line-height:1.45}
.wz-rail .wzs:hover{background:var(--soft)}
.wz-rail .wzs .i{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;font-size:12px;color:var(--ink-3);background:var(--white);position:relative;z-index:1}
/* 步骤之间那根竖线 */
.wz-rail .wzs::before{content:'';position:absolute;left:23px;top:36px;bottom:-4px;width:1px;background:var(--line-2)}
.wz-rail .wzs:last-child::before{display:none}
.wz-rail .wzs .wzs-tx{min-width:0;display:flex;flex-direction:column;gap:4px;padding-top:1px}
.wz-rail .wzs .wzs-tt{font-weight:500}
.wz-rail .wzs .wzs-got{display:flex;flex-direction:column;gap:2px}
.wz-rail .wzs .wzs-got span{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:168px;line-height:1.5}
.wz-rail .wzs.wzon{background:var(--accent-fill);color:var(--accent-ink)}
.wz-rail .wzs.wzon .i{background:var(--accent);border-color:var(--accent);color:#fff}
.wz-rail .wzs.wzdone{color:var(--ink)}
.wz-rail .wzs.wzdone .i{background:var(--accent-fill);border-color:var(--accent-line);color:var(--accent-ink)}

/* ── 中：问题区 ── */
.wz-main{flex:1;overflow:auto;padding:24px 28px 32px;background:var(--canvas);min-width:0}
.wz-side{width:320px;flex:0 0 auto;border-left:1px solid var(--line-2);overflow:auto;
  padding:24px 22px 30px;background:var(--white)}

/* 「已经替你查了」那条 */
.wz-auto{border-radius:var(--r-lg);background:var(--white);margin:0 0 16px;overflow:hidden;border:1px solid transparent;box-shadow:var(--sh-1)}
.wz-auto.bad{border-color:#F0DCB4}
.wz-ah{width:100%;display:flex;align-items:center;gap:9px;padding:14px 18px;border:0;
  background:none;cursor:pointer;text-align:left;font-size:13px;color:var(--ink)}
.wz-ah .wzspin{width:14px;height:14px;border:2px solid var(--accent-line);border-top-color:var(--accent);
  border-radius:50%;animation:wzsp .7s linear infinite;flex:0 0 auto}
@keyframes wzsp{to{transform:rotate(360deg)}}
.wz-ah .ok{color:var(--accent-ink);font-size:14px;flex:0 0 auto}
.wz-ah .wzn{font-size:12px;color:var(--ink-3);margin-left:auto;flex:0 0 auto}
.wz-ah .real{font-size:11px;color:var(--accent-ink);background:var(--accent-fill);
  border-radius:var(--r-pill);padding:1px 8px;flex:0 0 auto}
.wz-al{list-style:none;margin:0;padding:0 18px 14px;border-top:1px solid var(--line-2)}
.wz-auto.fold .wz-al{display:none}
.wz-al li{display:flex;gap:9px;padding:9px 0;font-size:13px;color:var(--ink-2);
  border-bottom:1px solid var(--line-2);line-height:1.7}
.wz-al li:last-child{border-bottom:0}
.wz-al li .wzd{width:6px;height:6px;border-radius:50%;background:var(--line);margin-top:7px;flex:0 0 auto}
.wz-al li.ok .wzd{background:var(--accent)}
/* 「没查到」用琥珀不用红：那不是报错，是需要人看见的一件事实 */
.wz-al li.miss .wzd{background:#C77700}
.wz-al li .bd{flex:1;min-width:0}
.wz-dt{display:block;margin-top:5px;font-size:12px;color:var(--ink-3);line-height:1.8}
.wz-dt b{color:#C77700;font-weight:500}
a.wz-doc{display:inline-block;margin:3px 5px 0 0;padding:2px 9px;border-radius:var(--ctl-r);
  background:var(--soft);color:var(--ink-2);font-size:12px;
  text-decoration:none;max-width:250px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;vertical-align:middle}
a.wz-doc:hover{background:var(--accent-fill);color:var(--accent-ink)}
.wz-more{font-size:12px;color:var(--ink-3)}

/* 问题卡 */
.wz-q{background:var(--white);border-radius:var(--r-lg);padding:28px 30px 10px;box-shadow:var(--sh-1)}
.wz-qn{font-size:12px;color:var(--ink-3);font-weight:500;margin:0 0 6px}
.wz-qt{font-size:28px;font-weight:600;color:var(--ink);margin:0 0 6px;letter-spacing:-.7px;line-height:1.15}
.wz-qh{font-size:15px;color:var(--ink-2);margin:0 0 28px;line-height:1.6}
.wz-item{margin:0 0 28px}
.wz-lbl{display:flex;gap:7px;font-size:15px;color:var(--ink);font-weight:600;margin:0 0 4px}
.wz-lbl .no{color:var(--ink);font-weight:400;flex:0 0 auto}
.wz-hint{font-size:13px;color:var(--ink-3);line-height:1.7;margin:0 0 12px}
.wz-item input[type=text],.wz-item textarea{width:100%;box-sizing:border-box;font:inherit;
  font-size:15px;color:var(--ink);padding:12px 14px;border:1px solid var(--ctl);
  border-radius:var(--box-r);background:var(--white);outline:none;resize:vertical;
  transition:border-color .12s}
/* placeholder 用 --ink-3，别吃浏览器默认色（约 #757575，深得像已填内容） */
.wz-item input[type=text]::placeholder,.wz-item textarea::placeholder{color:var(--ink-3)}
/* focus：只换主色描边，不要光环和投影（吉吉 2026-09-10） */
.wz-item input[type=text]:focus,.wz-item textarea:focus{border-color:var(--accent)}
/* 选项：灰底行，选中换主色浅底（Apple 的分组列表） */
.wz-opts{display:flex;flex-direction:column;gap:8px}
.wz-opt{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border:1px solid transparent;
  border-radius:var(--box-r);background:var(--soft);cursor:pointer;font-size:15px;color:var(--ink);
  transition:background .12s,border-color .12s}
.wz-opt:hover{background:var(--soft-2)}
.wz-opt.wzon{background:var(--accent-fill);border-color:var(--accent-line)}
.wz-opt .bx{width:18px;height:18px;flex:0 0 auto;margin-top:2px;border:1px solid var(--ctl);
  border-radius:var(--r-xs);background:var(--white);position:relative}
.wz-opt.rd .bx{border-radius:50%}
.wz-opt.wzon .bx{border-color:var(--accent);background:var(--accent)}
/* 飞鹊勾（yes2.svg）在四个地方用，尺寸各不同，统一在这里给 */
.wz-ck{display:block;flex:0 0 auto}
.wz-rail .wzs .i .wz-ck{width:12px;height:12px;color:var(--accent-ink)}
.wz-ah .ok .wz-ck{width:13px;height:13px;color:var(--accent-ink)}
.rc-item .mk .wz-ck{width:11px;height:11px;color:var(--accent-ink);margin-top:3px}
.wz-opt .bx .wz-ck{display:none}
.wz-opt.wzon .bx .wz-ck{display:block;width:13px;height:13px;color:#fff;
  position:absolute;left:2px;top:2px}
/* 单选圆点 */
.wz-opt.rd.wzon .bx::after{content:'';position:absolute;
  left:5px;top:5px;width:6px;height:6px;border:0;border-radius:50%;
  background:#fff;transform:none}
.wz-opt .od{display:block;font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.6}

/* ── 右：任务单 ── */
.rcpt-t{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.4px}
.rcpt-sub{font-size:13px;color:var(--ink-3);line-height:1.6;margin:3px 0 0}
.rc-sum{display:flex;align-items:center;gap:10px;margin:16px 0 6px}
.rc-sum .rc-bar{flex:1;height:4px;border-radius:var(--r-pill);background:var(--soft-2);overflow:hidden;display:block}
.rc-sum .rc-bar b{display:block;height:100%;background:var(--accent);border-radius:var(--r-pill);transition:width .2s}
.rc-sum .lb{font-size:12px;color:var(--ink-3)}
.rc-sum .wzn{font-size:13px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.rcpt-div{font-size:12px;color:var(--ink-3);font-weight:500;margin:24px 0 8px}
.rc-list{list-style:none;margin:0;padding:0}
.rc-item{display:flex;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.rc-item:last-child{border-bottom:0}
.rc-item .mk{color:var(--accent-ink);flex:0 0 auto}
.rc-item.off .mk{color:var(--ink-3)}
.rc-item .wznm{display:block;color:var(--ink-2);line-height:1.6}
.rc-item.off .wznm{color:var(--ink-3)}
.rc-item .vl{display:block;color:var(--ink);margin-top:2px;line-height:1.6;word-break:break-word;font-weight:500}
.rc-empty{font-size:13px;color:var(--ink-3);line-height:1.8;padding:6px 0}
.rc-out,.rc-kit{list-style:none;margin:0;padding:0}
.rc-out li,.rc-kit li{font-size:13px;color:var(--ink);padding:6px 0 6px 14px;position:relative;line-height:1.6}
.rc-out li::before,.rc-kit li::before{content:'';position:absolute;left:2px;top:13px;
  width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rc-kit li{color:var(--ink-2)}
.rc-kit li::before{background:var(--line)}
.rc-kit li .sn{color:var(--ink);font-weight:500}
.rc-kit li .wzsw{display:block;color:var(--ink-3);margin-top:1px;font-size:12px}

/* ── 底 ── */
.wz-ft{display:flex;align-items:center;gap:10px;padding:16px 24px;flex:0 0 auto;
  background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border-top:1px solid var(--glass-line)}
.wz-prog{font-size:13px;color:var(--ink-2)}
.wz-btn{font:inherit;font-size:14px;padding:10px 20px;border-radius:var(--r-pill);cursor:pointer;
  border:0;background:var(--white);color:var(--ink);box-shadow:var(--sh-1)}
.wz-btn:hover{background:var(--soft)}
.wz-btn.wzpri{background:var(--accent);color:#fff;box-shadow:none}
.wz-btn.wzpri:hover{background:var(--accent-hover)}
.wz-btn:disabled{opacity:.4;cursor:default}
.wz-tip{font-size:12px;color:var(--ink-3)}

/* ── 点文档名看原文 ── */
.wz-peek{position:fixed;right:26px;bottom:26px;width:430px;max-height:50vh;z-index:220;
  background:var(--white);border:1px solid var(--glass-line);border-radius:var(--box-r);   /* 浮在正文上的浮层用实色，不磨砂（2026-09-10） */
  box-shadow:var(--sh-2);display:none;flex-direction:column;overflow:hidden}
.wz-peek.wzon{display:flex}
.wz-ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2);
  font-size:13px;color:var(--ink);flex:0 0 auto}
.wz-ph b{font-weight:600}
.wz-ph .wzst{font-size:12px;color:var(--ink-3)}
.wz-ph .wzx{margin-left:auto;border:0;background:none;font-size:18px;color:var(--ink-3);cursor:pointer}
.wz-pb{padding:12px 14px;overflow:auto;font-size:12px;line-height:1.85;color:var(--ink-2);word-break:break-word}

@media (max-width:900px){
  .wizmask{padding:0}
  .wiz{height:100vh;border-radius:0;width:100%}
  /* 🔴 光写 flex-direction:column 不够 —— 实测 390px 下任务单直接盖住了问题区。
     真因是两个 flex-basis 打架：`.wz-main` 是 flex:1（basis 0%），而 `.wz-side`
     是 flex:0 1 auto（basis = 它自己 1100 多 px 的内容高）。竖排之后容器高度固定、
     可分配空间是负的，于是按 basis 收缩 —— main 的 basis 是 0，被压到只剩一条，
     side 占掉整屏。改成整列一起滚：问题在上，任务单在下面接着，谁都不压谁。 */
  .wz-body{flex-direction:column;overflow:auto}
  .wz-rail{flex:0 0 auto;width:auto;flex-direction:row;overflow-x:auto;border-right:0;
    border-bottom:1px solid var(--line-2);padding:10px 12px;gap:6px;scrollbar-width:none}
  .wz-rail::-webkit-scrollbar{display:none}
  .wz-rail .wzs{flex:0 0 auto;width:auto;padding:8px 12px;align-items:center;font-size:13px}
  .wz-rail .wzs::before{display:none}
  .wz-rail .wzs .wzs-got{display:none}
  .wz-main{flex:0 0 auto;overflow:visible;padding:16px}
  .wz-q{padding:20px 18px 6px}
  .wz-qt{font-size:22px}
  .wz-side{flex:0 0 auto;width:auto;border-left:0;border-top:1px solid var(--line-2)}
  .wz-peek{right:8px;left:8px;bottom:8px;width:auto}
}

不是有意维护的组件库。 · 重名实测=icon×76 · Cascader Menu Item×27 · Select Menu Item×27 · Input Caption×24 · Icon/UserOutlined×16 · Icon/InfoCircleOutlined×7 · Menu Item/Vertical/Navigation Item×8 · Icon/SearchOutlined×5 · slider×3 · radio buttons×3 · select menu group title×5 · input caption×4 · input pre post tab×4 · Ant Design 痕迹=Icon / UserOutlined、Icon / InfoCircleOutlined、Icon / SearchOutlined —— 这套命名是 Ant Design 的，不是飞鹊的。 · 变体被打散的痕迹=名字里直接带 variant 值：hover,left · hover,right · uploading,small,默认 · 为什么这是风险=它们**已发布、有正式 key、会被 search_design_system 搜出来**。实测搜 button 就返回了 3 个 Symbols 页的 radio buttons。因为数量多（214 vs 121），**搜到残留件比搜到正经组件更容易**。 · 怎么防=守住「先查清册再 search」这个顺序就行 —— 清册里有的直接用 key（100% 正确），清册没有才 search，这时看到 filePath 里是 Symbols 页的、或名字重复度高的、或没 description 的，先怀疑是残留件，别直接用。 · 要不要学=⏳ 等吉吉拍。我没有自己扩范围。"},{"k":"🔴 两端覆盖率对照（2026-09-01 实测）","v":"Web端=页数=77 · 全部已发布组件=261 · 清册收录=174 · 覆盖率=67% · 盲区在哪=82 个在 18 个未打勾页 · 盲区性质=**有价值**——含两页 MIC 业务卡片组件（业务组件探索 19 个 + 产品列表橱窗 19 个，后者是主搜/QP/LV 的 ProductCard） · 移动端=页数=61 · 全部已发布组件=337 · 清册收录=121 · 覆盖率=36% · 盲区在哪=214 个在 Symbols 页 · 盲区性质=**多半是残留**——重名散件（icon×76）、零 description、带 Ant Design 命名痕迹 · 一句话=两端都有盲区，但**性质相反**：Web 端漏掉的是值钱的业务组件，移动端漏掉的是旧文件垃圾。别用同一个决定处理两边。"}],"states":[{"k":"_说明","v":"2026-09-01 实测+看图。「悬停 / 按下 / 选中」在飞鹊里是三件不同的事，而且前两个两端互斥。做稿标注交互态之前先读这段。"},{"k":"1_悬停与按下_两端互斥","v":"结论=Web 端 button 有 hover 没有 press；移动端 button 有 press 没有 hover。**两端各缺对方那一个**（已实测 variantOptions，不是推测）。 · Web端 State 轴=default / hover / disabled · 移动端 State 轴=default / press / disabled · 含义=做移动端稿标注 hover 是错的（触屏没有悬停）；做 Web 端稿想找 press 态也找不到那个 variant。跨端搬交互标注会落空。"},{"k":"2_button 三态实测色值（两端 primary 一致）","v":"default=#E64545 · 绑 primary/buyer · 饱和红底白字 · hover(Web) / press(移动)=#CF3E3E · 绑 primary/buyer hover · 暗一档的红 · disabled=#E64545 · 绑 primary/buyer · **填充色不变，靠降透明度变浅**（淡红底白字） · token 名跟用途对不上=移动端的 **press** 态复用了名叫 `primary/buyer hover` 的 paint style。style 名写 hover、实际用途是按下。值是对的，别因为名字叫 hover 就以为移动端有悬停态。"},{"k":"3_secondary 的中间态_两端长得不一样","v":"Web端 secondary hover=**填充变浅灰 #F4F4F4**（绑 primary/dark background），描边保持 灰底黑框黑字 · 移动端 secondary press=**描边加粗变黑**，底仍是白 白底粗黑框黑字 · 含义=同一个「中间态」，Web 端靠换底色表达、移动端靠加重描边表达。别互抄。"},{"k":"4_「选中」button 没有这个态","v":"=button 的 State 轴里没有 selected/active。要「选中」得换组件 —— 下面这四套视觉语言完全不同，选错就是风格串味。 · 四套选中态（移动端·已看图）=selecter-single（按钮式单选·筛选用）=default = 白底 + 红描边 + 红字；selected = **淡红底 #FDF1F1** + 红描边 + 红字。**只加了层浅红底，描边和字色不变**。属品牌色系。 · selecter-multiple（按钮式多选）=selected = **浅灰底 + 黑色粗描边 + 黑字**，完全不用红。属中性色系 —— 跟 filter-bar/m 的选中态是同一套语言。 · checklist style1（整行可勾列表）=selected = **整行底色不变，右侧出现红色对勾**。 · radio（圆点式单选·表单用）=selected = **黑色实心圆 + 白色对勾**（不是红点，也不是圆环套圆点）。 · 最容易选错的=「单选」这个中文说法对应 radio 和 selecter-single 两个组件，**选中态一个是黑圆白勾、一个是淡红底胶囊**，长得毫无关系。上下文说不清就问一句。"},{"k":"5_🔴「选中/按下」这个概念在库里有 7 种写法","v":"移动端=state=selected=radio · checkbox · selecter-single · selecter-multiple · checklist style1/2 · letter · state=active=chip-icon-text/m（用 active 不用 selected） · Active=true=cascader-menu-item（**属性名首字母大写**） · checked=on=tab（而且 checked 轴混装了选中态和小红点：on|off|Little Red Dot） · State=press=button（**不带 ed**，属性名首字母大写） · state=pressed=page-header-webview/m · page-header-webview-control/m（**带 ed**，属性名小写） · Web端额外的两种=state=Selected=selecter-single（**首字母大写**），而同族 selecter-multiple 是小写 selected —— 同一族内部就不一致 · statues=active|inactive=radio 和 checkbox（**属性名拼错成 statues**，而且值用 active/inactive 不用 selected） · 一句话=别按印象写 `selected` 就完事 —— 先去 components.<组件名>.props 抄真名。"}]},"tk":{"col":[{"n":"主色 brandRed","hex":"#E64545","note":"飞鹊品牌红"},{"n":"文字 text/primary","hex":"#222","note":""},{"n":"文字 text/secondary","hex":"#555","note":""},{"n":"文字 text/tertiary","hex":"#888","note":""},{"n":"链接 link","hex":"#007DFA","note":"飞鹊唯一蓝，链接也用它"},{"n":"primary/buyer · main","hex":"#E64545","note":"red-1 / red-2 / red-5"},{"n":"primary/buyer · hover","hex":"#CF3E3E","note":"red-1 / red-2 / red-5"},{"n":"primary/buyer · lightBg","hex":"#FDF1F1","note":"red-1 / red-2 / red-5"},{"n":"primary/supplier · main","hex":"#007DFA","note":"blue-1 / blue-2 / blue-3"},{"n":"primary/supplier · hover","hex":"#0071E1","note":" nimation","d":"做动画/动效的手艺与判据 —— logo 片头、MG 动画、页面转场、loading、微交互、品牌动画都算。用户说\"做个动画/动效/片头\"、\"加个转场\"、\"让 logo 动起来\"、\"这个动画不够丝滑/很生硬/很卡/很粗糙/不够精致\"、\"怎么让它变高级\"时加载。不限实现工具：AE、CSS/JS 动画、Lottie、Figma 原型都适用，因为判断「什么叫好动画」跟用什么工具无关。自带「每帧都要成立」自查、听到\"不丝滑\"时的分诊法、精致技法清单、**复刻参照物时的形变分类表（哪些判据会说谎）**、四台机器判据（判卡顿/验形状自交/终帧逐像素对账/时间轴重叠断言），以及 AE 这条落地路径的完整工具链与 22 条静默坑。评审别人的动效、或要给动效提修改意见时也用它。","sz":13162},{"n":"CC-clarity","d":"'读 MIC 的微软 Clarity 行为数据——会话录制旅程、逐次点击文字、dead click、滚动深度、路径漏斗、页面参与度。用户说「看 Clarity」「查这个页面的用户行为」「用户怎么用这个功能」「给我录屏地址」「分析访问路径」「会话行为分析」，或者发来 clarity.microsoft.com 的筛选链接时加载。自带 MIC 全站页面正则表 + page_name 采样率表 + 调用记账器。 起手必读「三个前提」和「已证伪的十四条判据」——不读会拿到看起来对、其实错的数字。'","sz":43060},{"n":"CD-CC-figma","d":"把 Claude Design（claude.ai/design）做的 HTML 设计稿 1:1 还原到 Figma，全部调用飞鹊组件库。用户给 api.anthropic.com/v1/design/h/[hash] 这类 URL，或提到\"Claude Design\"、\"CD 稿\"、\"在 claude design 做的稿子\"、给本地 design bundle 文件夹，并要求\"实现/还原/做到 figma\"时加载。","sz":22804},{"n":"MIC-交互","d":"MIC 交互层的总沉淀——接 MIC/飞鹊需求做交互设计时，管「交互怎么想、业务规则怎么定、PRD 怎么反审、25% 潜规则怎么显式化」。接 MIC PRD、交互稿、需求分析、用户旅程、GSSM 设计目标、UED 自查类任务时加载。这是视觉实现（figma-feique-first）和交互稿提取（UX-Figma-MD）的上游——管「交互怎么想」，不是「怎么画」。","sz":31629},{"n":"MIC-交付规范","d":"管「设计稿怎么组织成前端和 AI 都能读懂并落地的交付物」——四段骨架(端/版本/交付说明_AI读/批注与参考_AI不读)、命名口径(默认名归零·variant 真名·现有元素前缀)、行为契约必须写进 AI 读区、母版唯一、隐藏节点三分类。交付给前端、做交付稿、被前端提规范问题、走查交付标准时加载。跟飞鹊视觉规范是两回事：那边管符不符设计系统，这边管前端能不能落地。","sz":31467},{"n":"MIC-表达","d":"管所有「给人看的对外材料」的表达方式——提案 / 方案 / 汇报 / 总结 / 复盘 / demo / PPT / 文档 / 给领导同事的稿。只管表达本身（让不让人一眼看懂、专不专业、炫不炫技），不管业务对错（那是别的 skill 的事）。三块：① 文字怎么说人话（不技术腔 / 主体点名 / 不用自造简写 / 不省略跳跃 / 人称统一 / 大格局朴实）② 视觉怎么克制清晰（苹果风 / 不斜体 / 不堆样式）③ 去 AI 味结构病 + 长文改写力度控制（否定式铺垫 / 空设问 / 无生命物当主语 / 远距离旁白 / 金句感 / 相邻章节同构；力度 × scope 两轴防长文越改越短；先锁事实再改风格；删无聊段 / 禁自评分——2026-07-05 吸收 stop-slop / shuorenhua / writing-agent 三个开源去 AI 味 skill 的净增部分）④ 整篇怎么搭骨架 + 收口 + 行文 + 句子（领导认可的方案 / 汇报 / 总结写作 6 层：认知顺序骨架 / 一句话定调 / 带参照系判断 / 承认双面留余地 / 打包成可复述结构 / 收口到对我们怎么办 / 用完整句和连接词把一段话写得人能读懂别压成符号堆 / 一句话怎么丝滑连贯客观——事实判断分开写、下判断带参照系、一句只扛一个意思）。做任何对外表达 / 写方案汇报总结时加载。","sz":45392},{"n":"MIC-视觉自检","d":"检查设计师做的 Figma 视觉稿符不符合飞鹊设计规范——四层(命名/A值token/B组件/C绑定/D结构自适应)只读遍历，找出没用 auto-layout、颜色字号间距没按 token、该用组件却手画、没绑 variable 的违规，出带严重度的报告 + 写飞书。用户说\"视觉稿自检\"、\"检查飞鹊规范\"、\"这稿规范吗\"、\"查有没有按组件来\"、\"查自适应/auto-layout\"、\"设计稿规范检查\"时加载。","sz":6865},{"n":"MIC-运营","d":"MIC 平台运营类需求的设计规范——招商专题/活动专题/行业专场、多尺寸投放 banner、邮件/VO 弹窗/朋友圈/信息推送素材、活动配置页/落地页/报名海报，中英文+Web+移动多版本。用户说\"做 MIC 运营 banner/专题/活动\"、\"招商 banner/投放素材\"、\"营销中心/信息推送/VO 弹窗/邮件/朋友圈\"+设计，或给含「专题/营销/招商/活动」字样的 Figma URL 时加载。","sz":31346},{"n":"MIC-验收","d":"'线上页面vs Figma视觉稿的验收走查——做视觉 + 代码CSS + token名「三重对齐」，找出不一致，产出带精确 Δ 数值（如 #E64545 / 1px / 40%）的本地MD报告 + side-by-side对比截图。用户说\"MIC验收\"、\"线上Figma对比\"、\"视觉对比/走查/找差异/视觉验收\"、\"线上跟设计稿对一下\"时加载。一次走查一个区块，元素级100% 覆盖不跳过。'","sz":75892},{"n":"SVG-figma-feique","d":"从 Figma 中粘贴的 SVG（由 Vector path 组成的\"死图\"）重建为真正的飞鹊组件——复用已有 Paint Style / Text Style / 字体，不新增样式命名空间，产出带 auto-layout + 真 TEXT 节点 + 全样式绑定 + 可选渐隐效果的 COMPONENT。触发：用户给一个 Figma 节点 URL 说\"做成飞鹊组件\"、\"改造成飞鹊\"、\"替换成飞鹊组件库\"、\"里面的文字/颜色/描边都用飞鹊的\"等。","sz":21079},{"n":"UX-Figma-MD","d":"从 Figma 交互稿（视觉稿+旁标交互说明文档形式）提取所有信息，整理成结构化 MD。两大核心能力：①不遗漏读取所有内容 ②严格按交互稿里的序号体系组织。触发条件：用户提供 Figma URL 并要求\"整理成交互稿 MD\"、\"读取交互文档\"、\"重组交互稿\"或类似涉及把 Figma 交互稿转 MD 的表述。","sz":13392},{"n":"feique-mobile-icon-lookup","d":"飞鹊 icon 组件（Web 端 + 移动端两套库，结构完全一致）的精确查找和调用。包含 12 个中文分类的精确字符串（含易错的全角括号/半角 &）、295 个图标名的完整映射、调用模板。触发：用户提到\"飞鹊 icon\"、\"飞鹊图标\"、\"飞鹊 web/移动端图标\"、\"MIC 图标\"、\"在 Figma 放图标\"、\"调用 icon 组件\"、或任何需要从 MIC 库取图标的场景。","sz":11128},{"n":"figma-feique-first","d":"飞鹊 Figma 视觉设计的「组件优先」流程——动手画任何 UI 元素前先查飞鹊有没有现成组件（先查本地清册 assets/feique-component-catalog.json，清册没有再 search_design_system），有组件必须 import 调用、禁止手画，没有才自由设计。用 Figma 做飞鹊/MIC 视觉稿、组件、页面、状态墙时加载。含常见陷阱清单（默认 HUG 不 FIXED、H/V 两轴同设、禁用 absolute、1024 不套桌面、shape=round 才是圆角等）。","sz":91022},{"n":"figma-to-html-feique","d":"把飞鹊/MIC的Figma节点1:1还原成HTML单文件demo。用户给Figma节点URL并说\"1:1还原成HTML\"、\"做成HTML单文件\"、\"实现这个设计\"、\"转成网页\"、\"Figma改HTML\"、\"做个demo看看效果\"时加载。含装饰元素对齐PIL截图实测死命令 + 飞鹊空状态/响应式断点规则。","sz":121680},{"n":"live-to-figma","d":"把已登录的线上页面（MIC/飞鹊自家产品，或需精确还原的竞品）1:1 还 /* ═══════════ 交互 ═══════════ */
function go(v){ S.view=v; S.mopen=false; render(); document.getElementById('main').scrollTop=0; }
function openLib(x){ S.lib=x; go('lib'); }
function setScene(id){ S.scene=id; S.sel=null; S.mopen=false; render(); }
function pick(x){
  const c = sceneById(S.scene).cards[x];
  S.sel=x; S.text=c.tpl; S.chips=[{n:c.n, i:c.i}]; S.focusEnd=true; S.mopen=false; render();
}
function pasteLink(){
  S.popen=false; const ta=document.getElementById('ta');
  S.text = (S.text ? S.text.replace(/\n?$/,'\n') : '') + '参考链接：';
  render(); const t=document.getElementById('ta'); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); }
}
function onPick(el){
  S.popen=false;
  [...el.files].forEach(f=>S.files.push({ n:f.name,
    u: f.type.startsWith('image/') ? URL.createObjectURL(f) : null }));   // 图片才有预览
  el.value=''; render();
}
function dropFile(i){
  const f=S.files[i]; if(f.u) URL.revokeObjectURL(f.u);
  S.files.splice(i,1); render();
}
function dropChip(i){ S.chips.splice(i,1); if(!S.chips.length) S.sel=null; render(); }
function pickCase(sc, ci){ S.scene=sc; S.mopen=false; pick(ci);
  document.getElementById('main').scrollTo({top:0,behavior:'smooth'}); }
function syncSend(){ const b=document.getElementById('send'); if(b) b.disabled=!(S.text.trim()||S.files.length); }
function submitTask(){
  if(!S.text.trim()) return;
  const sc = sceneById(S.scene);
  const card = S.sel!=null ? sc.cards[S.sel] : null;
  const raw = S.text.trim().split('\n')[0];
  const unfilled = /【[^】]*】/.test(S.text);   // 模板改成具体案例后，占位符是【】不是下划线
  const name = (unfilled && card) ? card.n : raw.replace(/【[^】]*】/g,'…').slice(0,24) || sc.name;
  S.text=''; S.sel=null; S.chips=[]; S.files=[]; render();
}
document.addEventListener('click',e=>{
  let ch=false;
  if(S.mopen && !e.target.closest('.model')){ S.mopen=false; ch=true; }

  /* ── 交互经验库（自查表） ── */
  var CKKEY='wb.checked';
  function readCk(){ try{ return JSON.parse(localStorage.getItem(CKKEY)||'{}'); }catch(e){ return {}; } }
  function writeCk(o){ try{ localStorage.setItem(CKKEY, JSON.stringify(o)); }catch(e){} }
  window.ckToggle = function(id){
    var o=readCk(); if(o[id]) delete o[id]; else o[id]=1; writeCk(o);
    var host=document.getElementById('fqhost'); if(host) host.innerHTML=LIB_BODY[LIBS[S.lib].n]();
  };
  window.ckOpen = function(i){ S.ckOpen = (S.ckOpen===i? -1 : i);
    var host=document.getElementById('fqhost'); if(host) host.innerHTML=LIB_BODY[LIBS[S.lib].n](); };
  window.ckReset = function(){ writeCk({}); fqToast('已清空勾选记录');
    var host=document.getElementById('fqhost'); if(host) host.innerHTML=LIB_BODY[LIBS[S.lib].n](); };

  function viewChecklist(){
    var q=S.fqQ||'', ck=readCk(), open=(S.ckOpen==null?0:S.ckOpen);
    var groups=FQD.cl.map(function(g,gi){
      var items=g.items.map(function(it,ii){ return {it:it, id:gi+'-'+ii}; })
                       .filter(function(x){ return hit(q,[x.it.t,x.it.d,x.it.g]); });
      return {g:g, gi:gi, items:items};
    }).filter(function(x){ return x.items.length; });
    var total=0, done=0;
    FQD.cl.forEach(function(g,gi){ g.items.forEach(function(_,ii){ total++; if(ck[gi+'-'+ii]) done++; }); });
    var pct = total? Math.round(done*100/total) : 0;
    var head = bar('搜自查条目', (q? groups.reduce(function(a,x){return a+x.items.length;},0)+' 条命中' : M.cl+' 条'), null, null, 'fqTab')
      + '<div class="prog"><span class="fqcnt">已过 '+done+' / '+total+'</span>'
      + '<span class="progbar"><i style="width:'+pct+'%"></i></span>'
      + '<button class="fqtab" onclick="ckReset()">清空勾选</button></div>'
      + '<div class="fqsec-p">这份表有两个用法：交互稿做完了逐条自查；接需求时反过来当跟产品经理对话的清单，问到的答案直接填进 GSSM 设计目标表。勾选只存在你自己这台电脑的浏览器里。</div>';
    if(!groups.length) return head + '<div class="libempty"><b>没有匹配的条目。</b></div>';
    return head + groups.map(function(x){
      var gdone=x.items.filter(function(y){ return ck[y.id]; }).length;
      var isOpen = q? true : (open===x.gi);
      return '<div class="ckgrp"><button class="ckh'+(isOpen?' open':'')+'" onclick="ckOpen('+x.gi+')">'+
        '<b>'+esc(x.g.s)+'</b><i>'+gdone+' / '+x.items.length+'</i>'+svgOf('down-big',14)+'</button>'+
        (isOpen? '<div class="ckbody">'+x.items.map(function(y){
          var on=!!ck[y.id];
          return '<div class="ckrow"><button class="ckbox'+(on?' on':'')+'" onclick="ckToggle(\''+y.id+'\')" aria-label="标记已检查">'+
            (on?svgOf('yes2',11):'')+'</button>'+
            '<div class="cktx'+(on?' done':'')+'">'+esc(y.it.d)+

            '</div></div>';

  window.fqFold = function(i){ S.foldOpen = (S.foldOpen===i? -1 : i);
    var h=document.getElementById('fqhost'); if(h) h.innerHTML=LIB_BODY[LIBS[S.lib].n](); };

  function foldGroups(groups, forceOpen){
    var open = (S.foldOpen==null? -1 : S.foldOpen);
    return groups.map(function(g, i){
      var isOpen = forceOpen || open===i;
      return '<div class="ckgrp"><button class="ckh'+(isOpen?' open':'')+'" onclick="fqFold('+i+')">'+
        '<b>'+esc(g.t)+'</b><i>'+g.rows.length+' 份</i>'+svgOf('down-big',14)+'</button>'+
        (isOpen? '<div class="ckbody"><table class="kv">'+g.rows.map(function(f){
            return '<tr><td class="k">'+esc(f.n)+'</td><td class="v">'+

          }).join('')+'</table></div>' : '')+'</div>';

  /* ── 业务知识库（目录级） ── */
  function viewBiz(){
    var q=S.fqQ||'', lines=FQD.bl, used={}, groups=[];
    lines.forEach(function(pr){
      var re=new RegExp(pr[1],'i');
      var rows=FQD.bz.filter(function(f){ if(used[f.n]||!re.test(f.n)) return false; used[f.n]=1; return true; });
      if(rows.length) groups.push({t:pr[0], rows:rows});
    });
    var rest=FQD.bz.filter(function(f){ return !used[f.n]; });
    if(rest.length) groups.push({t:'跨业务与通用', rows:rest});
    if(q){
      groups = groups.map(function(g){ return {t:g.t, rows:g.rows.filter(function(f){ return hit(q,[f.n,f.d]); })}; })
                     .filter(function(g){ return g.rows.length; });
    }
    var shown=groups.reduce(function(a,g){ return a+g.rows.length; },0);
    return bar('搜业务线、模块或术语', (q? shown+' 份命中' : M.bz+' 份文档 · 分 '+groups.length+' 组'), null, null, 'fqTab')
      + '<div class="fqsec-p">这里是目录，不是正文。列出每条业务线现在有哪些文档、各自讲什么，让你知道 WorkBuddy 执行任务时能查到什么。'
      + '具体规则要看原始需求文档和 wiki，那才是会更新的正本。</div>'
      + (groups.length? foldGroups(groups, !!q) : '<div class="libempty"><b>没有匹配的文档。</b><br>换个关键词，或者清空搜索框看全部。</div>');
  }

    var q=S.fqQ||'', used={}, groups=[];

        if(pr[0] && f.n.indexOf(pr[0])!==0) return false;
        used[f.n]=1; return true; });
      if(rows.length) groups.push({t:pr[1], rows:rows});
    });
    if(q){
      groups = groups.map(function(g){ return {t:g.t, rows:g.rows.filter(function(f){ return hit(q,[f.n,f.d]); })}; })
                     .filter(function(g){ return g.rows.length; });
    }
    var shown=groups.reduce(function(a,g){ return a+g.rows.length; },0);
    return bar('搜做法、判断或出过的问题', (q? shown+' 份命中' : M.mr+' 份 · 分 '+groups.length+' 组'), null, null, 'fqTab')
      + '<div class="fqsec-p">做过的项目留下来的判断：哪些做法有效、哪些地方出过问题、下次该怎么做。换一个项目仍然成立的才收进来。</div>'
      + (groups.length? foldGroups(groups, !!q) : '<div class="libempty"><b>没有匹配内容。</b><br>换个关键词，或者清空搜索框看全部。</div>');
  }

  /* ── 知识库更新提示卡：点「查看更新」之后收起 ──
     原来那个按钮只 go('libs')，提示一直挂着，下次打开还在 —— 等于按钮没意义。
     记住的是「批次」而不是「点过了」：用知识库生成日期的年月，
     所以下个月知识库真的更新了会再提示一次，而不是永久消失。 */
  (function(){
    var UKEY='wb.updSeen';
    var card=document.querySelector('.sb-card');
    if(!card) return;
    var id=String((FQD.m&&FQD.m.gen)||'').slice(0,7) || 'x';
    var seen='';
    try{ seen=localStorage.getItem(UKEY)||''; }catch(e){}
    if(seen===id){ card.hidden=true; return; }
    var btn=card.querySelector('.b');
    if(!btn) return;
    btn.removeAttribute('onclick');
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      try{ localStorage.setItem(UKEY, id); }catch(e2){}
      card.hidden=true;
      go('libs');
      fqToast('已收起。下次知识库更新会再提示');
    });
  })();

    'MIC 业务知识库': viewBiz,

  };
