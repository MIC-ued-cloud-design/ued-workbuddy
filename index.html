<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UED WorkBuddy</title>
<style>
:root{
  /* 全部取自 WorkBuddy 截图像素采样，不是估的 */
  --sb-bg:#F2F2F2; --canvas:#FFFFFF; --white:#fff; --soft:#F5F5F5;
  --ink:#333333;        /* --cb-text-primary */
  --ink-2:#666666;      /* --cb-text-secondary */
  --ink-3:#A0A0A0;      /* --cb-text-tertiary */
  --line:#EBEBEB; --line-2:#F0F0F0; --nav-on:#E6E6E6;
  --dark:#1A1A1A;       /* --cb-button-dark-background */
  --tab-on:#3B3B3B;
  --accent:#3B9EFF;        /* 轻盈蓝 · 图形用：描边/勾/开关/进度条/头像 */
  --accent-ink:#1682E8;    /* 文字用 · 深一档，12px 也读得清 */
  --accent-line:#BDDCFF;   /* 选中描边＝主色浅版 */
  --accent-fill:#E7F2FF;   /* 标签的浅实心底 */
  --sel:#F2F2F2;        /* --cb-bg-primary-active · 列表选中用中性底 */
  --r:12px; --r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink); background:var(--canvas); -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.app{display:flex;height:100vh;overflow:hidden}

/* ── 左栏 ────────────────────────────── */
.sb{width:262px;flex:0 0 262px;background:var(--sb-bg);display:flex;flex-direction:column;padding:14px 12px 12px}
.sb-head{display:flex;align-items:baseline;gap:7px;padding:6px 10px 16px}
.sb-head b{font-size:15px;font-weight:600;letter-spacing:.2px}
.sb-head span{font-size:12px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;
  font-size:14px;color:var(--ink);text-align:left;transition:background .12s}
.nav button:hover{background:#E9E9E9}
.nav button.on{background:var(--nav-on);font-weight:600}
.nav .fq{width:18px;height:18px;flex:0 0 18px;opacity:.82}
.nav button.on .fq{opacity:1}
.nav .tail{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}

.sb-sec{margin-top:24px;flex:1;min-height:0;display:flex;flex-direction:column}
.sb-sec-h{display:flex;align-items:center;gap:5px;padding:0 10px 8px;font-size:12px;color:var(--ink-2)}
.sb-list{overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.sb-item{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px}
.sb-item:hover{background:#E9E9E9}
.sb-item.on{background:var(--nav-on)}
.sb-item .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-item .m{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-top:2px}
.sb-empty{margin:4px 6px;padding:12px;background:var(--white);border-radius:10px;
  font-size:12px;line-height:1.7;color:var(--ink-2)}

.sb-card{margin-top:12px;padding:12px;background:var(--white);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sb-card .k{font-size:12px;font-weight:600;margin-bottom:3px}
.sb-card .d{font-size:12px;color:var(--ink-2);line-height:1.6}
.sb-card .b{margin-top:9px;display:inline-block;padding:5px 12px;background:var(--dark);color:#fff;
  border-radius:999px;font-size:12px}
.sb-foot{display:flex;align-items:center;gap:9px;margin-top:12px;padding:8px 8px 2px}
.ava{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;
  font-size:12px;font-weight:600;flex:0 0 28px}
.sb-foot .n{font-size:13px}
.sb-foot .r{margin-left:auto;display:flex;gap:16px;opacity:.5}

/* ── 第二栏（资料库专用 · 照 WorkBuddy 的三栏版式）── */
.col2[hidden]{display:none}   /* 必须写 —— [hidden] 打不过下面的 display:flex */
.col2{width:252px;flex:0 0 252px;background:#FAFAFA;border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 10px 10px}
.col2-h{padding:2px 8px 14px;font-size:19px;font-weight:650}
.c2search{display:flex;align-items:center;gap:7px;padding:7px 9px;margin:0 2px 10px;border-radius:8px;
  background:var(--white);border:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.c2search .fq{width:14px;height:14px}
.c2list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px}
.c2item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:8px;text-align:left;font-size:13px}
.c2item:hover{background:#F0F0F0}
.c2item.on{background:var(--nav-on);font-weight:600}
.c2item .fq{width:15px;height:15px;flex:0 0 15px;opacity:.7}
.c2item.on .fq{opacity:1}
.c2item .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c2item .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:400}
.c2grp{padding:14px 9px 6px;font-size:12px;color:var(--ink-3)}

/* 内容区表格（照 WorkBuddy 「最近」那张表）*/
.tbl{width:100%;border-collapse:collapse;margin-top:4px}
.tbl th{text-align:left;font-size:12px;font-weight:400;color:var(--ink-2);
  padding:0 12px 10px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 12px 12px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:middle;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
.tbl tbody tr:hover{background:#FAFAFA}
.tbl td.nm{font-weight:500}
.tbl td.nm .f{display:flex;align-items:center;gap:9px}
.tbl td.nm .fq{width:16px;height:16px;color:var(--ink-2);flex:0 0 16px}
.tbl th{vertical-align:bottom}
.tbl td.dim{color:var(--ink-2);font-size:12.5px}
.libempty{margin-top:28px;padding:34px;text-align:center;background:#FAFAFA;border-radius:12px;
  font-size:13px;color:var(--ink-2);line-height:1.85}

/* ── 主区 ────────────────────────────── */
main{flex:1;overflow-y:auto;position:relative;background:var(--canvas)}
.topr{position:absolute;top:18px;right:24px;z-index:5}
.topr button{display:flex;align-items:center;gap:6px;padding:7px 14px;background:var(--white);
  border:1px solid var(--line);border-radius:999px;font-size:12.5px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.wrap{max-width:824px;margin:0 auto;padding:96px 32px 64px}
.page{max-width:920px;margin:0 auto;padding:64px 32px}

h1{font-size:40px;line-height:1.25;font-weight:700;letter-spacing:-.5px;text-align:center;color:#000}
.sub{text-align:center;font-size:14.5px;color:var(--ink-2);margin-top:12px}

/* 场景 tab */
.tabs{display:flex;justify-content:center;gap:4px;margin:38px auto 0;padding:4px;
  background:#EBEBEB;border-radius:999px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tabs button{display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:999px;font-size:13.5px;
  color:var(--ink-2);white-space:nowrap;transition:.14s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--tab-on);color:#fff;font-weight:500}

.scene-note{text-align:center;font-size:13px;color:var(--ink-2);margin-top:16px}

/* 快捷卡 */
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:20px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;background:var(--white);
  border:1px solid var(--line);border-radius:999px;font-size:13.5px;transition:.13s}
.pill:hover{border-color:#DADADA;background:#FAFAFA}
.pill.on{background:var(--white);border-color:var(--accent-line);color:var(--accent-ink)}  /* 不填底色，只高亮 */
.pill .fq{width:15px;height:15px}
.pill .ar{font-size:12px;color:var(--ink-3);margin-left:1px}
.pill.on .ar{color:var(--accent-ink);opacity:.7}
.tile-h .ico .fq{width:17px;height:17px}
.cbar .fq,.cfoot .fq,.topr .fq{width:16px;height:16px}
.sb-foot .r .fq{width:17px;height:17px}
#sbIcons{display:flex;align-items:center;gap:18px}   /* gap 要挂在 svg 的直接父元素上 */
.mpop .fq{width:15px;height:15px}
/* 输入框里的场景标签（照 WorkBuddy 那个绿标签）*/
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px 0}
.tagchip{display:inline-flex;align-items:center;gap:6px;padding:3px 7px 3px 8px;background:var(--accent-fill);
  color:var(--ink);border-radius:6px;font-size:12.5px;font-weight:500}
.tagchip .fq{width:14px;height:14px}
/* 附件标签：× 在左侧，hover 出预览图（照 WorkBuddy）*/
.filechip{position:relative;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 7px;
  background:#EDEDED;border-radius:8px;font-size:12.5px;color:var(--ink);max-width:270px}
.filechip .x{display:grid;place-items:center;opacity:.55;border-radius:3px;flex:0 0 14px}
.filechip .x:hover{opacity:1}
.filechip .x .fq{width:12px;height:12px}
.filechip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fprev{position:absolute;bottom:calc(100% + 9px);left:-2px;display:none;background:var(--white);
  border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 12px 36px rgba(0,0,0,.18);z-index:40}
.filechip:hover .fprev{display:block}
.fprev img{display:block;max-width:320px;max-height:240px;border-radius:8px}
.tagchip button{display:grid;place-items:center;opacity:.6;border-radius:3px}
.tagchip button:hover{opacity:1}   /* hover 只提亮，不加底 */
.tagchip button .fq{width:11px;height:11px}
/* 最佳实践案例（照 WorkBuddy「不知道做什么，试试最佳实践案例」）*/
.cases{margin-top:44px}
.cases-h{display:flex;align-items:center;margin-bottom:12px}
.cases-h b{font-size:14.5px;font-weight:600}
.cases-h button{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2)}
.cases-h button:hover{color:var(--ink)}
.cases-h .fq{width:14px;height:14px}
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.case{text-align:left;background:var(--white);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;transition:.13s;display:flex;flex-direction:column;gap:8px}
.case:hover{border-color:#DADADA;box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.case .ico{width:30px;height:30px;background:#F2F2F2;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.case .ico .fq{width:17px;height:17px}
.case .t{font-size:13px;font-weight:600;line-height:1.45;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}  /* 标题固定一行 */
.case .g{font-size:12px;color:var(--ink-2);line-height:1.6}
.chip{font-size:12px;color:var(--ink-2);background:#F2F2F2;border-radius:4px;padding:2.5px 6px}

/* 输入区 */
.cwrap{margin-top:22px;background:var(--soft);border-radius:16px;padding:6px 6px 2px}
.composer{background:var(--white);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 2px 10px rgba(28,32,27,.05)}   /* 不能 overflow:hidden — 会剪掉向上展开的模型浮层 */
.composer.focus{border-color:#D4D4D4;box-shadow:0 2px 12px rgba(0,0,0,.07)}
textarea{width:100%;border:none;outline:none;resize:none;padding:15px 18px 8px;
  font-family:inherit;font-size:14.5px;line-height:1.7;   /* 不能写 font:14.5px/1.7 inherit —— 简写不收 inherit，整条会被丢 */
  color:var(--ink);background:none;min-height:112px}
textarea::placeholder{color:var(--ink-3)}
.cbar{display:flex;align-items:center;gap:8px;padding:8px 12px 12px}
.plusw{position:relative}
.cbar .plus{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.cbar .plus.open{background:#F2F2F2;color:var(--ink)}
.ppop{position:absolute;bottom:calc(100% + 10px);left:0;width:198px;background:var(--white);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.14);padding:6px;z-index:20}
.ppop .row{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8px;
  font-size:13px;color:var(--ink);text-align:left}   /* 只作用于 .row —— 写成 .ppop button 会连二级菜单的 .p2row 一起压成 32px */
.ppop .row:hover{background:var(--soft)}
.ppop .fq{width:16px;height:16px;color:var(--ink-2);flex:0 0 16px}
.ppop hr{border:none;border-top:1px solid var(--line);margin:5px 0}
/* 一级项 + 右侧二级菜单 */
.pitem{position:relative}
.pitem>.row{display:flex;align-items:center;gap:9px;width:100%;height:32px;padding:0 8px;
  border-radius:8px;font-size:13px;color:var(--ink);text-align:left}
.pitem>.row .ar{margin-left:auto;color:var(--ink-3);display:grid;place-items:center}
.pitem>.row .ar .fq{width:13px;height:13px}
.pitem:hover>.row{background:var(--soft)}
.ppop2{position:absolute;left:calc(100% + 6px);top:-6px;display:none;width:322px;background:var(--white);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.16);padding:6px;z-index:50}
.pitem:hover>.ppop2{display:block}
.p2search{display:flex;align-items:center;gap:8px;margin:2px 2px 6px;padding:8px 10px;border-radius:8px;
  background:var(--soft);font-size:12.5px;color:var(--ink-3)}
.p2search .fq{width:14px;height:14px}
.p2list{max-height:296px;overflow-y:auto}
.p2row{display:flex;align-items:flex-start;gap:9px;width:100%;padding:7px 8px;border-radius:8px;text-align:left}
.p2row:hover{background:var(--soft)}
.p2row .av{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:var(--accent-fill);
  color:var(--accent-ink);font-size:12px;font-weight:600;display:grid;place-items:center;margin-top:1px}
.p2row .tx{min-width:0;display:flex;flex-direction:column;gap:2px}   /* span 是 inline，不设 flex 会叠在一起 */
.p2row .n{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p2row .d{font-size:12px;color:var(--ink-2);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbar .plus:hover{background:#F2F2F2}
.cbar .sp{flex:1}
.model{position:relative}
.model>button svg{width:16px;height:16px}
.model>button{display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;font-size:12.5px;color:var(--ink-2)}
.model>button:hover{background:#EDEDED}
.model.open>button{background:#EDEDED;color:var(--ink)}
.mpop{position:absolute;bottom:calc(100% + 10px);right:0;width:360px;background:var(--white);
  border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.14);padding:6px;z-index:20;
  max-height:436px;overflow-y:auto}
.mpop .max{display:flex;align-items:center;gap:9px;padding:10px 10px 11px}
.mpop .max .nm{font-size:14px;font-weight:600}
.sw{margin-left:auto;width:38px;height:22px;border-radius:999px;background:#DEDEDE;position:relative;transition:.16s;flex:0 0 38px}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--accent)}
.sw.on i{left:18px}
.mhr{height:1px;background:var(--line);margin:2px 0}
.mpop .row{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8px;text-align:left}
.mpop .row:hover{background:var(--soft)}
.mpop .row.on{background:var(--sel)}   /* 列表选中＝中性底 + 绿勾（WorkBuddy 自己的做法）*/
.mpop .row .nm{font-size:13.5px;display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.mpop .row .nm>span:first-child{white-space:nowrap}
.mpop .badge{font-size:12px;padding:1.5px 6px;border-radius:4px;white-space:nowrap}
.mpop .badge.free{background:#FDECEC;color:#D0463F}
.mpop .badge.sub{background:#FBF1DE;color:#96702A}
.mpop .badge.rec{background:var(--sel);color:var(--accent-ink)}
.mpop .rate{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.mpop .tick{color:var(--accent);flex:0 0 15px;visibility:hidden;display:grid;place-items:center}
.mpop .row.on .tick{visibility:visible}
.mpop .mfoot{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:8px;width:100%;font-size:12.5px;color:var(--ink-2);text-align:left}
.mpop .mfoot:hover{background:var(--soft);color:var(--ink)}
.mic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.mic:hover{background:#F2F2F2;color:var(--ink)}
.mic .fq{width:17px;height:17px}
.send .fq,.send svg{width:15px;height:15px}
.send{width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;display:grid;place-items:center;flex:0 0 34px}
.send[disabled]{background:#C6C6C6;cursor:default}
.cfoot{display:flex;gap:6px;padding:9px 10px 5px}
.cfoot button{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-3);padding:5px 10px;border-radius:8px}
.cfoot button:hover{color:var(--ink-2);background:#EDEDED}

/* 通用页面 */
.ph{margin-bottom:26px}
.ph h2{font-size:26px;font-weight:650;letter-spacing:-.2px}
.ph p{font-size:14px;color:var(--ink-2);margin-top:8px;max-width:620px;line-height:1.75}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left}
.tile-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.tile-h .ico{width:30px;height:30px;flex:0 0 30px;background:#F2F2F2;border-radius:8px;display:grid;place-items:center;color:var(--ink)}
.tile-h b{font-size:14.5px;font-weight:600}
.tag{font-size:12px;padding:2px 8px;border-radius:4px;background:var(--accent);color:#fff;margin-left:auto}
.tag.soon{background:#EDEDED;color:#8C8C8C}
.tile .cnt{font-size:12px;color:var(--ink);font-weight:500;margin-bottom:6px}
.tile .ds{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.grp{margin-bottom:26px}
.grp-t{font-size:12px;color:var(--ink-3);margin-bottom:9px;padding-left:2px}
.srow{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;margin-bottom:6px}
.srow .nm{font-size:13.5px;font-weight:500}
.srow .code{font-size:12px;color:var(--ink-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.srow .ds{margin-left:auto;font-size:12px;color:var(--ink-2);text-align:right;max-width:44%}
.prow{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);
  border-radius:var(--r);padding:15px 17px;margin-bottom:8px;text-align:left;width:100%}
.prow .nm{font-size:14.5px;font-weight:600}
.prow .m{font-size:12px;color:var(--ink-2);margin-top:4px}
.prow .st{margin-left:auto;text-align:right;flex:0 0 auto}
.prow .st .s{font-size:12.5px;font-weight:500}
.prow .st .u{font-size:12px;color:var(--ink-3);margin-top:3px}
.bar{display:flex;gap:3px;margin-top:9px}
.bar i{height:3px;flex:1;background:#EBEBEB;border-radius:2px}
.bar i.d{background:var(--accent)}
.note{display:flex;gap:9px;align-items:flex-start;background:rgba(0,0,0,.045);border:none;

  return `<div class="page">
    <div class="ph"><h2>技能与规范</h2>
      <p>每一项技能是一套做事方法，包含判断标准和检查步骤。建任务时按场景自动调用，不用自己记名字 —— 这一页只是让你知道现在有哪些能力。</p></div>
    ${SKILLS.map(([g,rows])=>`<div class="grp"><div class="grp-t">${g}</div>
      ${rows.map(([n,code,d])=>`<div class="srow"><div><div class="nm">${n}</div><div class="code">${code}</div></div>
        <div class="ds">${d}</div></div>`).join('')}</div>`).join('')}
  </div>`;
}

function viewProjects(){
  return `<div class="page">
    <div class="ph"><h2>我的项目</h2>
      <p>一个需求从调研到复盘的产出物都收在这里，继续上次的进度不用重新说明背景。</p></div>
    ${PROJECTS.map(p=>`<button class="prow">
      <div><div class="nm">${p.n}</div><div class="m">${p.out} 项产出 · 负责人 ${p.mem}</div>
        <div class="bar">${[1,2,3,4,5].map(i=>`<i class="${i<=p.stage?'d':''}"></i>`).join('')}</div></div>
      <div class="st"><div class="s">${STAGE_NAMES[p.stage]}</div><div class="u">${p.upd}</div></div>
    </button>`).join('')}
    <div class="note">${ic.fq_info}<div><b>示例项目用的是真实项目名，内容是预置的。</b>这一版用于确认形态，尚未接入真实数据。</div></div>
  </div>`;
}

function render(){
  renderNav();
  const c2 = document.getElementById('col2'), inLibs = (S.view==='libs'||S.view==='lib');
  c2.hidden = !inLibs;
  if(inLibs) c2.innerHTML = renderCol2();
  const v = { new:viewNew, libs:viewLibs, lib:viewLib, skills:viewSkills, projects:viewProjects }[S.view];
  document.getElementById('main').innerHTML = v();
  if(S.view==='new'){ const ta=document.getElementById('ta'); if(ta&&S.focusEnd){ ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); S.focusEnd=false; } }
}

/* ═══════════ 交互 ═══════════ */
function go(v){ S.view=v; S.mopen=false; render(); document.getElementById('main').scrollTop=0; }
function openLib(x){ S.lib=x; go('lib'); }
function setScene(id){ S.scene=id; S.sel=null; S.mopen=false; render(); }
function pick(x){
  const c = sceneById(S.scene).cards[x];
  S.sel=x; S.text=c.tpl; S.chips=[{n:c.n, i:c.i}]; S.focusEnd=true; S.mopen=false; render();
}
function pasteLink(){
  S.popen=false; const ta=document.getElementById('ta');
  S.text = (S.text ? S.text.replace(/\n?$/,'\n') : '') + '参考链接：';
  render(); const t=document.getElementById('ta'); if(t){ t.focus(); t.setSelectionRange(t.value.length,t.value.length); }
}
function onPick(el){
  S.popen=false;
  [...el.files].forEach(f=>S.files.push({ n:f.name,
    u: f.type.startsWith('image/') ? URL.createObjectURL(f) : null }));   // 图片才有预览
  el.value=''; render();
}
function dropFile(i){
  const f=S.files[i]; if(f.u) URL.revokeObjectURL(f.u);
  S.files.splice(i,1); render();
}
function dropChip(i){ S.chips.splice(i,1); if(!S.chips.length) S.sel=null; render(); }
function pickCase(sc, ci){ S.scene=sc; S.mopen=false; pick(ci);
  document.getElementById('main').scrollTo({top:0,behavior:'smooth'}); }
function syncSend(){ const b=document.getElementById('send'); if(b) b.disabled=!(S.text.trim()||S.files.length); }
function submitTask(){
  if(!S.text.trim()) return;
  const sc = sceneById(S.scene);
  const card = S.sel!=null ? sc.cards[S.sel] : null;
  const raw = S.text.trim().split('\n')[0];
  const unfilled = /【[^】]*】/.test(S.text);   // 模板改成具体案例后，占位符是【】不是下划线
  const name = (unfilled && card) ? card.n : raw.replace(/【[^】]*】/g,'…').slice(0,24) || sc.name;
  S.tasks.unshift({ n:name, scene:sc.name, time:'刚刚' });
  S.text=''; S.sel=null; S.chips=[]; S.files=[]; render();
}
document.addEventListener('click',e=>{
  let ch=false;
  if(S.mopen && !e.target.closest('.model')){ S.mopen=false; ch=true; }
  if(S.popen && !e.target.closest('.plusw')){ S.popen=false; ch=true; }
  if(ch) render();
});
render();  // 启动渲染
document.getElementById('sbIcons').innerHTML = ic.fq_bell + ic.fq_keyboard;
</script>
</body>
</html>
