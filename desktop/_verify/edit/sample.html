<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>询盘页示例</title>
<style>
body{margin:0;font-family:Roboto,sans-serif;color:#222;padding:24px;width:1240px;box-sizing:border-box}
h1{font-size:24px;font-weight:700;margin:0 0 16px}
.cards{display:flex;gap:16px;margin-bottom:24px}
.card{width:280px;height:140px;background:#F5F7FA;padding:16px;box-sizing:border-box;border-radius:8px}
.card b{display:block;font-size:16px;margin-bottom:8px}
.card p{margin:0;color:#555;font-size:14px}
a.btn{display:inline-block;padding:8px 16px;background:#E64545;color:#fff;border-radius:6px;text-decoration:none;font-size:14px}
</style></head>
<body>
  <h1 class="title">Hello world</h1>
  <section class="cards">
    <div class="card" data-k="1"><b>Card A</b><p>First card body text</p></div>
    <div class="card" data-k="2"><b>Card B</b><p>Second card body text</p></div>
    <div class="card" data-k="3"><b>Card C</b><p>Third card body text</p></div>
  </section>
  <a class="btn" href="https://example.com" id="cta">Send Inquiry</a>
  <p class="row"><a class="btn btn-md btn-primary" id="fqbtn" href="#">Buy</a> <span id="icowrap"><svg class="ico" style="color:#555" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.375 2C10.3435 2 12.75 4.40647 12.75 7.375C12.75 8.67922 12.2853 9.87485 11.5127 10.8057L13.9883 13.2812L13.2812 13.9883L10.8057 11.5127C9.87485 12.2853 8.67922 12.75 7.375 12.75C4.40647 12.75 2 10.3435 2 7.375C2 4.40647 4.40647 2 7.375 2ZM7.375 3C4.95875 3 3 4.95875 3 7.375C3 9.79125 4.95875 11.75 7.375 11.75C9.79125 11.75 11.75 9.79125 11.75 7.375C11.75 4.95875 9.79125 3 7.375 3Z" fill="currentColor"/></svg></span></p>
  <div class="bleed" style="margin:0 -24px;height:40px;background:#eee">full bleed</div>
  <p class="row"><span id="icohard"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 13.5C16.0815 13.5 20.1636 15.3516 20.1636 15.3516C20.6806 15.5864 21 16.1093 21 16.6772V20.25H3V16.6772C3 16.1093 3.3194 15.5864 3.83643 15.3516C7.91793 13.5006 12 13.5 12 13.5Z" fill="#222222"/><path d="M12 3C14 3 15.75 4.75 15.75 6.75C15.75 8.75 14 10.5 12 10.5C10 10.5 8.25 8.75 8.25 6.75C8.25 4.75 10 3 12 3Z" fill="#222222"/></svg></span></p>
</body></html>
