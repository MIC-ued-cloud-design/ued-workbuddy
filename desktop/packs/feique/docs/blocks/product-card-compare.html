【怎么用】
1. 下面 <style> 整段贴进你页面的 <style>，一个值都别改。
2. <article class="pcc"> 整段贴进页面，只替换：图片 src、文案、链接。
3. 带 SLOT 的位置必须 cat 出真 SVG 替换掉，路径已写死。

【尺寸口径】
单卡 253×367。产品图 229×229（圆角 8）。padding 上右左 12、下 16。
高度构成 12 + 229 + 8+68 + 8+26 + 16 = 367

【🔴 这张卡里有一半元素在组件里是隐藏的，默认态不要画出来】
组件里 visible=false 的（做默认态一律不显示）：
· 底部那条「Chat Now」按钮（229×40 pill，白底 1px #222，16px Bold）—— **默认是隐藏的**
· 图上的轮播指示器（6 个 16×3 白条）、左右翻页箭头（36×36）、删除按钮（36×36）
· 占位文字「[ Product Image ]」、两个 select-pill
默认态图上**只有右上角那个 Select 胶囊**（93×36，top 10 / right 10）。
要用那些隐藏态，去 node 10752:2633 里按名字取，别自己造一个。

【跟其它五张产品卡不是一路】
这张没有 Secured Trading、没有供应商行、没有评分、没有 Send Inquiry。
它是「勾选对比」场景的卡：图 + Select 勾选 + 品证标 + 标题 + 价格。价格 **18px Bold**
（主搜网格 20px / 主搜列表 26px / LV 20px，四个值都不一样，别照抄）。

【内联图标出自 icons/】
yes2.svg —— 勾选框里的勾。🔴 飞鹊有三个勾：yes 是圆圈+勾、yes-f 是实心圆挖勾、
**checkbox 要用 yes2（纯勾）**，别拿错。
