2026-09-15 从组件逐节点抽出的几何与样式，不是照截图估的。

【怎么用】
1. 下面 <style> 整段贴进你页面的 <style>，一个值都别改。
2. <article class="pcg"> 整段贴进页面，只替换：图片 src、文案、链接。
3. 带 SLOT 的位置必须 cat 出真 SVG 替换掉，路径已写死。留着不换 = 残缺交付。

【尺寸口径】
单卡 350×585（定宽，网格里并排放）。产品图 310×310。
高度构成 20 + 310 + 6+22 + 2+44 + 6+48 + 6+22 + 6+17 + 18+38 + 20 = 585

【跟列表版（product-card-list.html）哪里不一样 —— 别互相照抄】
按钮行两版**完全一样**（125×38 pill ×2 + 38×38 购物车，gap 10），品牌标尺寸也一样。
不一样的是这三处：
· 标题：网格版 14px/22 固定两行（44 高）；列表版 16px/24 单行。
· 价格：网格版 20px Bold/26；列表版 26px Bold/32。MOQ 同理 14 vs 16。
· 公司名颜色：网格版 **#888888**；列表版 #222222。🔴 这条最容易照抄错。

【认证标必须用 brand/productcard/ 那一批】
brand/ 根目录那 18 个是从别处导的，尺寸对不上（sts 组件里 106×22 而根目录 87×16，
品证 116×22 vs 182×22，Audited 46×16 vs 105×16）。brand/productcard/ 下的四个
是直接从产品卡组件导出并清过画布杂质的，两版产品卡共用这一批。

【内联的四个图标出自 icons/，不是手画的】
heart.svg（收藏 24×24）· tm.svg（Chat now 16×16，填充改品牌蓝 #007DFA）
cart-add.svg（询价篮 18×18）· right.svg（供应商箭头 16×16）
