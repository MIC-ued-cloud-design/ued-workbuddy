飞鹊 · ProductCard-主搜(List) —— 主搜结果页产品卡（列表版）

真值出处：Figma gcanH38jg2SMmXwrcC6FP8 · node 7974:7314 · variant 7764:2463（默认态）
2026-09-15 从组件逐节点抽出的几何与样式，不是照截图估的。

【怎么用】
1. 下面 <style> 整段贴进你页面的 <style>，一个值都别改。
2. <article class="pcl"> 整段贴进页面，只替换：图片 src、文案、链接。
3. 带 SLOT 注释的位置必须 cat 出真 SVG 替换掉，路径已经写死在注释里。
   留着不换 = 残缺交付（品牌认证标里的字是矢量图形，拿文字拼一定不对）。

【内联的四个图标出自 icons/，不是手画的】
heart.svg（收藏 24×24）· tm.svg（Chat now 16×16，填充改品牌蓝 #007DFA）
cart-add.svg（询价篮 18×18）· right.svg（供应商箭头 16×16）

【尺寸口径】
单卡 1167×323。产品图固定 280×280，右侧内容区流式（窄屏自动收）。
高度构成 20 + 22 + 4+24 + 4+32 + 24 + 4+66 + 8+43 + 14+38 + 20 = 323
宽度构成 20 + 280 + 26 + 821 + 20 = 1167

【已对数 · 2026-09-15】
渲染结果跟 Figma 真值逐坐标比过 13 项，12 项对上（1px 内是浏览器亚像素舍入）。
唯一一处差异是 Figma 自己的：按钮行容器标宽 311，但它三个子元素实际占 308
（125 + 10 + 125 + 10 + 38），按内容走 308 是对的，三个按钮位置全部对得上。

【三个最容易做错的地方 —— 2026-09-15 实测都错过】
· 两个按钮在卡片左下角横排一行，不在右上角、不竖排。
· 按钮是 pill（border-radius 1000px），规格 125×38 + 14px Bold。
  砖表的 btn-lg 是 40px/16px、btn-md 是 32px/14px，两档都对不上 ——
  这是产品卡专用规格，别拿砖表的 .btn 替换，也别自己改成直角。
· 收藏心形在产品图内部右上角（top/right 各 14px），不是浮在卡片外面。

【认证标必须用 brand/productcard/ 那一批】
brand/ 根目录那 18 个标是从别处导的，跟产品卡里实际用的对不上：
  Secured Trading 组件里 106×22，brand/sts-with-text.svg 是 87×16（比例都不同）
  品证 Certified   组件里 116×22，brand/certificate-group.svg 是 182×22
  Audited          组件里 46×16， brand/audited-with-text.svg 是 105×16
brand/productcard/ 下的四个是 2026-09-15 直接从本组件导出并清过画布杂质的，尺寸一一对上。
做产品卡一律用这批，别用 brand/ 根目录那批。

【组件没定义的】
标题超长时的截断行为组件里没有，需要时问设计，别自己定几行。
