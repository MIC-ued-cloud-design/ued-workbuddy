2026-09-15 从组件逐节点抽出。data-node-id 是 Figma 节点号，用来机器复验。

【怎么用】
<style> 整段贴进页面，<aside class="vos"> 贴在内容区左侧。
换选中项＝把 vos-on 这个类挪到对应的 <a> 上。

【🔴 组件的两个 variant 不是两份结构，是同一份结构换选中项】
inquiry 档选中「收件箱」，settings 档选中「CRM账户管理」，除此之外两档**逐节点完全相同**
（都含询盘/采购需求/我的客户/通用设置四组）。所以这里只做一份，别做成两个片段。

【尺寸口径】
210×782 固定。上下各 16 内边距。
分组标题 31 高（padding 5/20，图标 16 + 间距 8 + 文字 14/22 #888888）
普通项 30 高（padding 5/20/5/45 —— 左边 45 是因为它比所属的分组标题再往右缩一层，不是 20）
分隔块 41 高（上下各 20 padding，中间一条 1px #E6ECF2 满宽横线）
按钮块 53 高，按钮本体 168×33
高度合计 16+31+180+41+31+60+53+41+31+90+41+31+120+16 = 782

【🔴 三个容易做错的地方】
· 「搜索采购需求」按钮的 1px 描边用 box-shadow:inset，不是 border。
  Figma 里这条描边是 INSIDE，写成 border 会把文字往右推 1px（44 变 45）—— 实测就差这 1px。
· 两种红标规格不同：count-badge 是 18 高 / padding 0-5 / 圆角 8；
  「New」标是 18 高 / padding 0-5 / 圆角 15。别互相套，也别套 vo-header 那个 20 高的 badge。
· 分组标题的图标颜色不统一：询盘 / 采购需求 / 通用设置是 #888888，
  **「我的客户」那个是 #222222**。这是组件里就有的不一致，这里原样还原了 ——
  要不要统一得设计定，我没擅自改。

【怎么复验】
· **随包能直接做的**：量整体尺寸应该是 210×782。
· **源码仓里有机器门**（不随应用分发）：
  `node build/verify-block.js --block packs/feique/docs/blocks/vo-sider.html --truth build/blocks-truth/vo-sider.json`
  逐元素比 68 项，全绿才算过。

【组件没定义的】
hover 态、分组能不能折叠、侧栏在窄屏怎么办，组件里都没有，需要时问设计。
